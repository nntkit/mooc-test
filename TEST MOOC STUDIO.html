                <p class="text-xs text-[#718278]">รองรับไฟล์ <b>.json</b> (ที่ส่งออกจากระบบ), <b>.csv</b> (UTF-8) และ <b>.xlsx</b> (Excel) ระบบจะตรวจสอบความถูกต้องและแสดงตัวอย่างก่อนนำเข้า</p>
                <input type="file" id="import-exam-file" accept=".json,.csv,.xlsx,.xls"
                  class="block w-full text-xs text-[#40564A] file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#0fb762] file:text-white hover:file:bg-[#0b9951] cursor-pointer" />
              </div>

              <!-- Full Backup & Restore -->
              <div class="card-surface p-5 space-y-4">
                <h2 class="font-bold text-base flex items-center gap-2">
                  <i data-lucide="shield-check" class="w-5 h-5 text-[#0fb762]"></i> สำรองข้อมูลทั้งระบบ (Full Backup & Restore)
                </h2>
                <p class="text-xs text-[#718278]">ส่งออกชุดข้อสอบ คลังคำถาม ประวัติการสอบ และการตั้งค่าทั้งหมดเป็นไฟล์ JSON ไฟล์เดียว เพื่อย้ายเครื่องหรือสำรองข้อมูล</p>
                <div class="flex flex-wrap gap-2.5">
                  <button onclick="ExportImportService.exportFullBackupJSON()" class="px-4 py-2.5 rounded-xl btn-primary text-xs font-semibold flex items-center gap-1.5">
                    <i data-lucide="download" class="w-4 h-4"></i> สำรองข้อมูลทั้งหมด (Full Backup)
                  </button>
                  <label class="px-4 py-2.5 rounded-xl border border-[#0fb762] text-[#0fb762] hover:bg-[#a1ffcf]/20 text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i> กู้คืนข้อมูล (Import Backup)
                    <input type="file" id="import-backup-file" accept=".json" class="hidden" />
                  </label>
                </div>
              </div>

              <!-- Export Quiz Results -->
              <div class="card-surface p-5 space-y-4">
                <h2 class="font-bold text-base flex items-center gap-2">
                  <i data-lucide="table" class="w-5 h-5 text-[#3984C6]"></i> ส่งออกรายงานผลการสอบ (Export Results)
                </h2>
                <p class="text-xs text-[#718278]">ดาวน์โหลดประวัติคะแนนสอบทั้งหมดในรูปแบบตาราง CSV (รองรับภาษาไทยใน Excel ด้วย UTF-8 BOM) หรือไฟล์ Excel (.xlsx)</p>
                <div class="flex flex-wrap gap-2.5">
                  <button onclick="ExportImportService.exportResultsCSV()" class="px-4 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-xs font-semibold flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-4 h-4 text-[#0fb762]"></i> ส่งออก CSV
                  </button>
                  <button onclick="ExportImportService.exportResultsXLSX()" class="px-4 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-xs font-semibold flex items-center gap-1.5">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4 text-[#0B9951]"></i> ส่งออก Excel (.xlsx)
                  </button>
                </div>
              </div>

              <!-- Danger Zone -->
              <div class="card-surface p-5 space-y-4 border-[#DC4B4B]/40">
                <h2 class="font-bold text-base text-[#DC4B4B] flex items-center gap-2">
                  <i data-lucide="alert-triangle" class="w-5 h-5"></i> ล้างข้อมูล (Danger Zone)
                </h2>
                <p class="text-xs text-[#718278]">คำเตือน: การลบข้อมูลไม่สามารถย้อนกลับได้ หากไม่มีไฟล์สำรองข้อมูล (Backup)</p>
                <div class="flex flex-wrap gap-2">
                  <button id="clear-history-btn" class="px-3.5 py-2 rounded-xl border border-[#DC4B4B] text-[#DC4B4B] hover:bg-[#DC4B4B]/10 text-xs font-semibold">ล้างประวัติการสอบ</button>
                  <button id="clear-exams-btn" class="px-3.5 py-2 rounded-xl border border-[#DC4B4B] text-[#DC4B4B] hover:bg-[#DC4B4B]/10 text-xs font-semibold">ล้างชุดข้อสอบทั้งหมด</button>
                  <button id="reset-all-btn" class="px-3.5 py-2 rounded-xl bg-[#DC4B4B] text-white text-xs font-semibold">รีเซ็ตแอปทั้งหมด</button>
                </div>
              </div>
            </div>
          </div>
        `;

        // Handle Import Exam File with Preview Modal
        document.getElementById('import-exam-file').onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const parsed = await ExportImportService.parseExamImportFile(file);
            const ok = await UI.confirm({
              title: 'ยืนยันการนำเข้าชุดข้อสอบ',
              message: `
                <div class="space-y-2 text-xs">
                  <p>พบชุดข้อสอบ: <b>${Utils.escapeHTML(parsed.exam.title)}</b></p>
                  <p>วิชา: <b>${Utils.escapeHTML(parsed.exam.subject)}</b> • จำนวนคำถาม: <b>${parsed.questions.length} ข้อ</b></p>
                  <div class="p-2.5 rounded-lg bg-[#F7FBF8] dark:bg-[#16221d] max-h-40 overflow-y-auto space-y-1">
                    ${parsed.questions.slice(0, 5).map((q, i) => `<div>${i + 1}. ${Utils.escapeHTML(q.text)}</div>`).join('')}
                    ${parsed.questions.length > 5 ? `<div class="text-[#718278]">... และอีก ${parsed.questions.length - 5} ข้อ</div>` : ''}
                  </div>
                </div>
              `,
              confirmText: 'นำเข้าชุดข้อสอบนี้'
            });
            if (ok) {
              const newExamId = Utils.uid('exam');
              const now = new Date().toISOString();
              const qs = parsed.questions.map((q, i) => ({
                ...q,
                id: Utils.uid('q'),
                examId: newExamId,
                order: i + 1
              }));
              const totalScore = qs.reduce((s, q) => s + Number(q.score || 1), 0);
              await db.transaction('rw', db.exams, db.questions, async () => {
                await db.exams.put({
                  ...parsed.exam,
                  id: newExamId,
                  questionCount: qs.length,
                  totalScore,
                  version: 1,
                  createdAt: now,
                  updatedAt: now
                });
                await db.questions.bulkPut(qs);
              });
              UI.toast(`นำเข้าชุดข้อสอบ "${parsed.exam.title}" สำเร็จ!`, 'success');
              App.navigate('my-exams');
            }
          } catch (err) {
            UI.toast('นำเข้าไฟล์ไม่สำเร็จ: ' + err.message, 'error');
          }
          e.target.value = '';
        };

        // Handle Full Backup Restore
        document.getElementById('import-backup-file').onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const text = await file.text();
            const parsed = JSON.parse(text);
            if (parsed.exportType !== 'FULL_BACKUP' || !parsed.data) {
              throw new Error('ไฟล์นี้ไม่ใช่ไฟล์ Full Backup ของ TEST MOOC STUDIO');
            }
            const d = parsed.data;
            const ok = await UI.confirm({
              title: 'ยืนยันการกู้คืนข้อมูลสำรอง (Restore Backup)',
              message: `พบข้อมูลสำรองเมื่อวันที่ <b>${Utils.formatDate(parsed.exportedAt)}</b><br/>
                ประกอบด้วยชุดข้อสอบ <b>${(d.exams || []).length} ชุด</b> และประวัติการสอบ <b>${(d.attempts || []).length} รายการ</b><br/><br/>
                ระบบจะผสานและอัปเดตข้อมูลเข้าสู่ฐานข้อมูลปัจจุบัน ยืนยันหรือไม่?`,
              confirmText: 'กู้คืนข้อมูลทันที'
            });
            if (ok) {
              await db.transaction('rw', db.exams, db.questions, db.attempts, db.questionBank, db.categories, db.subjects, db.favorites, db.wrongAnswers, async () => {
                if (d.exams?.length) await db.exams.bulkPut(d.exams);
                if (d.questions?.length) await db.questions.bulkPut(d.questions);
                if (d.attempts?.length) await db.attempts.bulkPut(d.attempts);
                if (d.questionBank?.length) await db.questionBank.bulkPut(d.questionBank);
                if (d.categories?.length) await db.categories.bulkPut(d.categories);
                if (d.subjects?.length) await db.subjects.bulkPut(d.subjects);
                if (d.favorites?.length) await db.favorites.bulkPut(d.favorites);
                if (d.wrongAnswers?.length) await db.wrongAnswers.bulkPut(d.wrongAnswers);
              });
              UI.toast('กู้คืนข้อมูลสำรองทั้งหมดสำเร็จ!', 'success');
              App.navigate('dashboard');
            }
          } catch (err) {
            UI.toast('ไฟล์สำรองข้อมูลไม่ถูกต้อง: ' + err.message, 'error');
          }
          e.target.value = '';
        };

        // Clear History
        document.getElementById('clear-history-btn').onclick = async () => {
          const ok = await UI.confirm({
            title: 'ยืนยันการล้างประวัติการสอบทั้งหมด',
            message: 'ข้อมูลประวัติการสอบและคะแนนทั้งหมดจะถูกลบถาวร (ชุดข้อสอบจะยังคงอยู่) ยืนยันหรือไม่?',
            confirmText: 'ล้างประวัติทั้งหมด',
            danger: true
          });
          if (!ok) return;
          await db.attempts.clear();
          await db.answers.clear();
          UI.toast('ล้างประวัติการสอบทั้งหมดแล้ว', 'success');
          App.navigate('data-management');
        };

        // Clear Exams
        document.getElementById('clear-exams-btn').onclick = async () => {
          const ok = await UI.confirm({
            title: 'ยืนยันการล้างชุดข้อสอบทั้งหมด',
            message: 'ชุดข้อสอบและคำถามทั้งหมดในเครื่องจะถูกลบถาวร ยืนยันหรือไม่?',
            confirmText: 'ล้างชุดข้อสอบทั้งหมด',
            danger: true
          });
          if (!ok) return;
          await db.exams.clear();
          await db.questions.clear();
          UI.toast('ล้างชุดข้อสอบทั้งหมดแล้ว', 'success');
          App.navigate('data-management');
        };

        // Reset All
        document.getElementById('reset-all-btn').onclick = async () => {
          const ok = await UI.confirm({
            title: 'รีเซ็ตแอปพลิเคชันทั้งหมด (Factory Reset)',
            message: 'ข้อมูลทั้งหมดใน IndexedDB จะถูกลบและคืนค่าเริ่มต้นใหม่ทั้งหมด ยืนยันหรือไม่?',
            confirmText: 'รีเซ็ตทั้งหมด',
            danger: true
          });
          if (!ok) return;
          await db.delete();
          location.reload();
        };
      },

      /* --------------------------------------------------------------------------
       * VIEW 13: SETTINGS & SUBJECT/CATEGORY MANAGEMENT
       * -------------------------------------------------------------------------- */
      async renderSettings(container) {
        const settings = await DBService.getSettings();
        const subjects = await db.subjects.toArray();
        const categories = await db.categories.toArray();

        container.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6 pb-12">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold">Settings (ตั้งค่าระบบและจัดการรายวิชา)</h1>
              <p class="text-xs sm:text-sm text-[#718278]">ปรับแต่งค่าเริ่มต้นของการสอบ ชื่อผู้เข้าสอบ ธีมสี และการจัดการรายวิชา/หมวดหมู่</p>
            </div>

            <!-- General & Exam Defaults -->
            <form id="settings-form" class="card-surface p-5 space-y-4">
              <h2 class="font-bold text-base border-b border-[#E5EEE8] dark:border-[#24382f] pb-3">ตั้งค่าการสอบและผู้ใช้งาน</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold mb-1">ชื่อผู้เข้าสอบเริ่มต้น (Default Examinee Name)</label>
                  <input type="text" id="set-examinee" value="${Utils.escapeHTML(settings.defaultExamineeName)}" placeholder="เช่น นายสมชาย ใจดี"
                    class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">ธีมการแสดงผล (Theme Mode)</label>
                  <select id="set-theme" class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                    <option value="light" ${settings.theme === 'light' ? 'selected' : ''}>Light Mode (สว่างสะอาดตา)</option>
                    <option value="dark" ${settings.theme === 'dark' ? 'selected' : ''}>Dark Mode (ถนอมสายตา)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">เวลาสอบเริ่มต้น (นาที)</label>
                  <input type="number" id="set-time" value="${settings.defaultExamTime}" min="1" max="300"
                    class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">เกณฑ์คะแนนผ่านเริ่มต้น (%)</label>
                  <input type="number" id="set-passing" value="${settings.defaultPassingScore}" min="0" max="100"
                    class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">การแสดงเฉลยเริ่มต้น</label>
                  <select id="set-ans-mode" class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                    <option value="after_submit" ${settings.answerDisplayMode === 'after_submit' ? 'selected' : ''}>แสดงเฉลยหลังส่งข้อสอบ</option>
                    <option value="immediate" ${settings.answerDisplayMode === 'immediate' ? 'selected' : ''}>แสดงเฉลยทันทีหลังตอบ</option>
                    <option value="never" ${settings.answerDisplayMode === 'never' ? 'selected' : ''}>ซ่อนเฉลย</option>
                  </select>
                </div>
                <div class="flex flex-col justify-center gap-2 pt-2">
                  <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" id="set-sound" ${settings.soundEnabled ? 'checked' : ''} class="rounded text-[#0fb762]" />
                    <span>เปิดเสียงแจ้งเตือน (Sound Effects)</span>
                  </label>
                  <label class="flex items-center gap-2 text-sm cursor-pointer">
                    <input type="checkbox" id="set-timer-notify" ${settings.timerNotifications ? 'checked' : ''} class="rounded text-[#0fb762]" />
                    <span>แจ้งเตือนเมื่อเหลือเวลา 5 นาที และ 1 นาที</span>
                  </label>
                </div>
              </div>
              <div class="pt-3 flex justify-end">
                <button type="submit" class="px-5 py-2 rounded-xl btn-primary text-sm font-semibold">บันทึกการตั้งค่า</button>
              </div>
            </form>

            <!-- Flexible Subject & Category Management -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="card-surface p-5 space-y-3">
                <h3 class="font-bold text-base">จัดการรายวิชา (Subjects)</h3>
                <div class="flex gap-2">
                  <input type="text" id="new-subject-input" placeholder="เพิ่มชื่อวิชาใหม่..."
                    class="flex-1 px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                  <button type="button" id="add-subject-btn" class="px-4 py-2 rounded-xl btn-primary text-xs font-semibold">เพิ่ม</button>
                </div>
                <div class="space-y-1.5 max-h-60 overflow-y-auto pt-1">
                  ${subjects.map(s => `
                    <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                      <span>${Utils.escapeHTML(s.name)}</span>
                      <button type="button" data-del-subj="${s.id}" class="text-xs text-[#DC4B4B] hover:underline">ลบ</button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="card-surface p-5 space-y-3">
                <h3 class="font-bold text-base">จัดการหมวดหมู่ (Categories)</h3>
                <div class="flex gap-2">
                  <input type="text" id="new-cat-input" placeholder="เพิ่มหมวดหมู่ใหม่..."
                    class="flex-1 px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                  <button type="button" id="add-cat-btn" class="px-4 py-2 rounded-xl btn-primary text-xs font-semibold">เพิ่ม</button>
                </div>
                <div class="space-y-1.5 max-h-60 overflow-y-auto pt-1">
                  ${categories.map(c => `
                    <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                      <span>${Utils.escapeHTML(c.name)}</span>
                      <button type="button" data-del-cat="${c.id}" class="text-xs text-[#DC4B4B] hover:underline">ลบ</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('settings-form').onsubmit = async (e) => {
          e.preventDefault();
          const newTheme = document.getElementById('set-theme').value;
          await DBService.saveSetting('defaultExamineeName', document.getElementById('set-examinee').value.trim());
          await DBService.saveSetting('theme', newTheme);
          await DBService.saveSetting('defaultExamTime', Number(document.getElementById('set-time').value || 40));
          await DBService.saveSetting('defaultPassingScore', Number(document.getElementById('set-passing').value || 60));
          await DBService.saveSetting('answerDisplayMode', document.getElementById('set-ans-mode').value);
          await DBService.saveSetting('soundEnabled', document.getElementById('set-sound').checked);
          await DBService.saveSetting('timerNotifications', document.getElementById('set-timer-notify').checked);

          App.state.settings = await DBService.getSettings();
          App.applyTheme(newTheme);
          UI.toast('บันทึกการตั้งค่าระบบเรียบร้อยแล้ว', 'success');
        };

        document.getElementById('add-subject-btn').onclick = async () => {
          const val = document.getElementById('new-subject-input').value.trim();
          if (!val) return;
          await db.subjects.put({ id: Utils.uid('subj'), name: val, isDefault: false });
          UI.toast(`เพิ่มวิชา "${val}" สำเร็จ`, 'success');
          App.navigate('settings');
        };

        container.querySelectorAll('[data-del-subj]').forEach(btn => {
          btn.onclick = async () => {
            await db.subjects.delete(btn.getAttribute('data-del-subj'));
            App.navigate('settings');
          };
        });

        document.getElementById('add-cat-btn').onclick = async () => {
          const val = document.getElementById('new-cat-input').value.trim();
          if (!val) return;
          await db.categories.put({ id: Utils.uid('cat'), name: val, color: '#0fb762', icon: 'folder' });
          UI.toast(`เพิ่มหมวดหมู่ "${val}" สำเร็จ`, 'success');
          App.navigate('settings');
        };

        container.querySelectorAll('[data-del-cat]').forEach(btn => {
          btn.onclick = async () => {
            await db.categories.delete(btn.getAttribute('data-del-cat'));
            App.navigate('settings');
          };
        });
      }
    };

    /**
     * ============================================================================
     * 9. PWA OFFLINE SERVICE WORKER REGISTRATION & BOOTSTRAP
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      App.init();

      // Register Inline Service Worker for Offline Caching when served over HTTPS/Localhost
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        const swCode = `
          const CACHE_NAME = 'test-mooc-studio-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              fetch(e.request)
                .then((res) => {
                  const clone = res.clone();
                  caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone));
                  return res;
                })
                .catch(() => caches.match(e.request))
            );
          });
        `;
        try {
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        } catch (e) { /* Ignore in sandboxed iframe */ }
      }
    });
  </script>
</body>
