<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TEST MOOC STUDIO — Personal Exam Builder & LMS</title>

  <!-- Google Fonts: Sarabun & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Sarabun"', '"Inter"', 'sans-serif'],
            display: ['"Inter"', '"Sarabun"', 'sans-serif'],
          },
          colors: {
            brand: {
              green: '#0fb762',
              greenDark: '#0b9951',
              lime: '#c6ec44',
              mint: '#a1ffcf',
              fresh: '#8eff7b',
              heading: '#173B2B',
              body: '#40564A',
              muted: '#718278',
              border: '#E5EEE8',
              lightBg: '#F7FBF8',
            }
          }
        }
      }
    }
  </script>

  <!-- Dexie.js for Robust IndexedDB Local-First Persistence -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js for Learning Analytics & Dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- SheetJS for XLSX & CSV Import/Export -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-main: #ffffff;
      --bg-subtle: #F7FBF8;
      --text-heading: #173B2B;
      --text-body: #40564A;
      --text-muted: #718278;
      --border-color: #E5EEE8;
    }
    html.dark {
      --bg-main: #0f1714;
      --bg-subtle: #16221d;
      --text-heading: #e8f5ee;
      --text-body: #c2d6cb;
      --text-muted: #849c8f;
      --border-color: #24382f;
    }
    body {
      font-family: 'Sarabun', 'Inter', sans-serif;
      background-color: var(--bg-subtle);
      color: var(--text-body);
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-heading {
      color: var(--text-heading);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #2f473c;
    }
    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .timer-urgent {
      animation: pulseUrgent 1s infinite;
    }
    .card-surface {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 2px 10px rgba(23, 59, 43, 0.03);
    }
    .btn-primary {
      background-color: #0fb762;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: #0b9951;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="antialiased selection:bg-[#a1ffcf] selection:text-[#173B2B]">

    <!-- MOBILE DRAWER BACKDROP -->
    <div id="mobile-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden backdrop-blur-xs" onclick="App.closeMobileDrawer()"></div>

        <button onclick="App.closeMobileDrawer()" class="lg:hidden p-1.5 rounded-lg text-[#718278]">

      <!-- Active Resume Banner in Sidebar if exam in progress -->
      <div id="sidebar-resume-banner" class="hidden mx-3 mt-3 p-3 rounded-xl bg-[#a1ffcf]/40 dark:bg-[#0fb762]/20 border border-[#0fb762]/40">

          <span class="flex items-center gap-1.5 text-[#0B9951] font-medium">

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 min-w-0 flex flex-col">

          <div id="global-db-badge" class="text-xs px-3 py-1.5 rounded-full bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f] text-[#40564A] dark:text-gray-300 flex items-center gap-1.5">

  <!-- MODAL CONTAINER -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-xs">

      <!-- Dynamic Modal Content -->

  <!-- TOAST CONTAINER -->

  <!-- JAVASCRIPT APPLICATION ENGINE -->
  <script>
    /**
     * ============================================================================
     * 1. DATABASE LAYER (Dexie.js / IndexedDB Local-First Architecture)
     * ============================================================================
     */
    const db = new Dexie('TestMoocStudioDB');
    db.version(1).stores({
      exams: 'id, title, subject, category, difficulty, createdAt, updatedAt, version',
      questions: 'id, examId, order, type, subject, category, difficulty',
      attempts: 'id, examId, status, startedAt, submittedAt, mode, examineeName',
      answers: 'id, attemptId, questionId',
      questionBank: 'id, subject, category, type, difficulty, createdAt',
      categories: 'id, name',
      subjects: 'id, name, isDefault',
      favorites: 'id, questionId, subject, createdAt',
      wrongAnswers: 'id, questionId, subject, category, reviewed, updatedAt',
      drafts: 'id, updatedAt',
      settings: 'key'
    });

    const DBService = {
      async initDefaults() {
        // Seed Default Subjects if empty
        const subjCount = await db.subjects.count();
        if (subjCount === 0) {
          const defaultSubjects = [
            { id: 'subj_thai', name: 'ภาษาไทย', isDefault: true },
            { id: 'subj_math', name: 'คณิตศาสตร์', isDefault: true },
            { id: 'subj_eng', name: 'ภาษาอังกฤษ', isDefault: true },
            { id: 'subj_sci', name: 'วิทยาศาสตร์', isDefault: true },
            { id: 'subj_soc', name: 'สังคมศึกษา', isDefault: true },
            { id: 'subj_tech', name: 'เทคโนโลยีและคอมพิวเตอร์', isDefault: true }
          ];
          await db.subjects.bulkPut(defaultSubjects);
        }

        // Seed Default Categories if empty
        const catCount = await db.categories.count();
        if (catCount === 0) {
          const defaultCategories = [
            { id: 'cat_general', name: 'ความรู้ทั่วไป', color: '#0fb762', icon: 'book-open' },
            { id: 'cat_midterm', name: 'สอบกลางภาค', color: '#3984C6', icon: 'file-text' },
            { id: 'cat_final', name: 'สอบปลายภาค', color: '#E6A817', icon: 'award' },
            { id: 'cat_practice', name: 'แบบฝึกหัดทบทวน', color: '#0B9951', icon: 'check-circle' },
            { id: 'cat_admission', name: 'เตรียมสอบแข่งขัน', color: '#DC4B4B', icon: 'target' }
          ];
          await db.categories.bulkPut(defaultCategories);
        }

        // Seed Default Settings if empty
        const settingsCount = await db.settings.count();
        if (settingsCount === 0) {
          await db.settings.bulkPut([
            { key: 'theme', value: 'light' },
            { key: 'soundEnabled', value: true },
            { key: 'timerNotifications', value: true },
            { key: 'defaultExamTime', value: 40 },
            { key: 'defaultPassingScore', value: 60 },
            { key: 'defaultExamineeName', value: '' },
            { key: 'answerDisplayMode', value: 'after_submit' }, // 'immediate' | 'after_submit' | 'never'
            { key: 'shuffleQuestionsDefault', value: false },
            { key: 'shuffleOptionsDefault', value: false }
          ]);
        }
      },

      async getSettings() {
        const rows = await db.settings.toArray();
        const map = {};
        rows.forEach(r => map[r.key] = r.value);
        return {
          theme: map.theme ?? 'light',
          soundEnabled: map.soundEnabled ?? true,
          timerNotifications: map.timerNotifications ?? true,
          defaultExamTime: Number(map.defaultExamTime ?? 40),
          defaultPassingScore: Number(map.defaultPassingScore ?? 60),
          defaultExamineeName: map.defaultExamineeName ?? '',
          answerDisplayMode: map.answerDisplayMode ?? 'after_submit',
          shuffleQuestionsDefault: Boolean(map.shuffleQuestionsDefault),
          shuffleOptionsDefault: Boolean(map.shuffleOptionsDefault)
        };
      },

      async saveSetting(key, value) {
        await db.settings.put({ key, value });
      }
    };

    /**
     * ============================================================================
     * 2. AUDIO & UTILITY SERVICES
     * ============================================================================
     */
    const Utils = {
      uid(prefix = 'id') {
        return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
      },
      escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },
      formatDate(iso) {
        if (!iso) return '-';
        const d = new Date(iso);
        return d.toLocaleDateString('th-TH', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      },
      formatDuration(seconds) {
        if (seconds === null || seconds === undefined || seconds < 0) return '00:00';
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        const pad = n => String(n).padStart(2, '0');
        if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
        return `${pad(mins)}:${pad(secs)}`;
      },
      playTone(type = 'notify') {
        if (!App.state.settings.soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          if (type === 'warning') {
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.35);
          } else if (type === 'finish') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.45);
          } else {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
          }
        } catch (e) { /* Ignore audio policy restriction */ }
      },
      shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      },
      difficultyBadge(diff) {
        const map = {
          easy: { label: 'ง่าย', cls: 'bg-[#8eff7b]/30 text-[#0B9951] border-[#8eff7b]' },
          medium: { label: 'ปานกลาง', cls: 'bg-[#c6ec44]/40 text-[#173B2B] border-[#c6ec44]' },
          hard: { label: 'ยาก', cls: 'bg-[#DC4B4B]/15 text-[#DC4B4B] border-[#DC4B4B]/30' }
        };
        const item = map[diff] || map.medium;
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${item.cls}">${item.label}</span>`;
      },
      questionTypeLabel(type) {
        const map = {
          multiple_choice: 'ปรนัย 1 คำตอบ (Multiple Choice)',
          multiple_select: 'ปรนัยหลายคำตอบ (Multiple Select)',
          true_false: 'ถูก / ผิด (True / False)',
          short_answer: 'ตอบสั้น (Short Answer)',
          fill_blank: 'เติมคำในช่องว่าง (Fill in the Blank)',
          matching: 'จับคู่ (Matching)',
          ordering: 'เรียงลำดับ (Ordering)',
          essay: 'อัตนัย / เรียงความ (Essay - ตรวจเอง)'
        };
        return map[type] || type;
      }
    };

    /**
     * ============================================================================
     * 3. UI COMPONENTS (Toast, Modals, Confirmations)
     * ============================================================================
     */
    const UI = {
      toast(message, type = 'success') {
        const root = document.getElementById('toast-root');
        const id = Utils.uid('toast');
        const styles = {
          success: { bg: 'bg-white dark:bg-[#16221d] border-[#0fb762]', icon: 'check-circle-2', iconColor: 'text-[#0fb762]' },
          error: { bg: 'bg-white dark:bg-[#16221d] border-[#DC4B4B]', icon: 'alert-circle', iconColor: 'text-[#DC4B4B]' },
          warning: { bg: 'bg-white dark:bg-[#16221d] border-[#E6A817]', icon: 'alert-triangle', iconColor: 'text-[#E6A817]' },
          info: { bg: 'bg-white dark:bg-[#16221d] border-[#3984C6]', icon: 'info', iconColor: 'text-[#3984C6]' }
        };
        const st = styles[type] || styles.info;
        const el = document.createElement('div');
        el.id = id;
        el.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border-l-4 shadow-lg ${st.bg} transition-all duration-300 transform translate-y-2 opacity-0`;
        el.innerHTML = `
          <i data-lucide="${st.icon}" class="w-5 h-5 shrink-0 mt-0.5 ${st.iconColor}"></i>
          <div class="text-sm font-medium text-[#173B2B] dark:text-white flex-1">${Utils.escapeHTML(message)}</div>
          <button onclick="document.getElementById('${id}')?.remove()" class="text-[#718278] hover:text-[#173B2B]">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        `;
        root.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        requestAnimationFrame(() => {
          el.classList.remove('translate-y-2', 'opacity-0');
        });
        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 4000);
      },

      openModal(htmlContent, maxWidthClass = 'max-w-lg') {
        const root = document.getElementById('modal-root');
        const box = document.getElementById('modal-box');
        box.className = `bg-white dark:bg-[#0f1714] border border-[#E5EEE8] dark:border-[#24382f] rounded-2xl shadow-xl w-full ${maxWidthClass} max-h-[90vh] flex flex-col overflow-hidden`;
        box.innerHTML = htmlContent;
        root.classList.remove('hidden');
        root.classList.add('flex');
        lucide.createIcons({ nodes: [box] });
      },

      closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        root.classList.remove('flex');
      },

      confirm({ title, message, confirmText = 'ยืนยัน', cancelText = 'ยกเลิก', danger = false }) {
        return new Promise((resolve) => {
          const btnClass = danger
            ? 'bg-[#DC4B4B] hover:bg-red-700 text-white'
            : 'bg-[#0fb762] hover:bg-[#0b9951] text-white';
          this.openModal(`
            <div class="p-5 border-b border-[#E5EEE8] dark:border-[#24382f] flex items-center justify-between">
              <h3 class="font-bold text-lg text-[#173B2B] dark:text-white flex items-center gap-2">
                <i data-lucide="${danger ? 'alert-triangle' : 'help-circle'}" class="w-5 h-5 ${danger ? 'text-[#DC4B4B]' : 'text-[#0fb762]'}"></i>
                ${Utils.escapeHTML(title)}
              </h3>
              <button id="modal-close-x" class="p-1 rounded-lg text-[#718278] hover:bg-[#F7FBF8] dark:hover:bg-[#16221d]">

    /**
     * ============================================================================
     * 4. SCORING ENGINE (Supports all 8 Question Types + Manual Essay Grading)
     * ============================================================================
     */
    const ScoringEngine = {
      normalizeText(str, caseSensitive = false) {
        if (str === null || str === undefined) return '';
        let s = String(str).trim().replace(/\s+/g, ' ');
        return caseSensitive ? s : s.toLowerCase();
      },

      gradeQuestion(question, userAnswer) {
        const maxPoints = Number(question.score || 1);
        const isUnanswered = userAnswer === undefined || userAnswer === null ||
          (Array.isArray(userAnswer) && userAnswer.length === 0) ||
          (typeof userAnswer === 'string' && userAnswer.trim() === '') ||
          (typeof userAnswer === 'object' && !Array.isArray(userAnswer) && Object.keys(userAnswer).length === 0);

        if (isUnanswered) {
          return {
            status: 'unanswered',
            earnedScore: 0,
            maxScore: maxPoints,
            isCorrect: false
          };
        }

        switch (question.type) {
          case 'multiple_choice':
          case 'true_false': {
            const correct = String(userAnswer) === String(question.correctAnswer);
            return {
              status: correct ? 'correct' : 'incorrect',
              earnedScore: correct ? maxPoints : 0,
              maxScore: maxPoints,
              isCorrect: correct
            };
          }

          case 'multiple_select': {
            const expected = Array.isArray(question.correctAnswer) ? [...question.correctAnswer].map(String).sort() : [];
            const actual = Array.isArray(userAnswer) ? [...userAnswer].map(String).sort() : [];
            const exactMatch = expected.length === actual.length && expected.every((v, i) => v === actual[i]);
            return {
              status: exactMatch ? 'correct' : 'incorrect',
              earnedScore: exactMatch ? maxPoints : 0,
              maxScore: maxPoints,
              isCorrect: exactMatch
            };
          }

          case 'short_answer':
          case 'fill_blank': {
            const acceptable = Array.isArray(question.acceptableAnswers) && question.acceptableAnswers.length > 0
              ? question.acceptableAnswers
              : [question.correctAnswer];
            const normUser = this.normalizeText(userAnswer, question.caseSensitive);
            const matched = acceptable.some(ans => this.normalizeText(ans, question.caseSensitive) === normUser && normUser !== '');
            return {
              status: matched ? 'correct' : 'incorrect',
              earnedScore: matched ? maxPoints : 0,
              maxScore: maxPoints,
              isCorrect: matched
            };
          }

          case 'matching': {
            // question.pairs = [{ left, right }]
            // userAnswer = { [index]: selectedRight }
            const pairs = question.pairs || [];
            if (pairs.length === 0) return { status: 'incorrect', earnedScore: 0, maxScore: maxPoints, isCorrect: false };
            let correctCount = 0;
            pairs.forEach((p, idx) => {
              if (userAnswer && String(userAnswer[idx]) === String(p.right)) {
                correctCount++;
              }
            });
            const allCorrect = correctCount === pairs.length;
            const partialScore = Number(((correctCount / pairs.length) * maxPoints).toFixed(2));
            return {
              status: allCorrect ? 'correct' : 'incorrect',
              earnedScore: allCorrect ? maxPoints : partialScore,
              maxScore: maxPoints,
              isCorrect: allCorrect
            };
          }

          case 'ordering': {
            // question.items = ['Step 1', 'Step 2', ...] in correct order
            // userAnswer = ['Step 1', 'Step 2', ...]
            const expected = question.items || [];
            const actual = Array.isArray(userAnswer) ? userAnswer : [];
            const allCorrect = expected.length === actual.length && expected.every((v, i) => String(v) === String(actual[i]));
            return {
              status: allCorrect ? 'correct' : 'incorrect',
              earnedScore: allCorrect ? maxPoints : 0,
              maxScore: maxPoints,
              isCorrect: allCorrect
            };
          }

          case 'essay': {
            return {
              status: 'pending_review',
              earnedScore: 0,
              maxScore: maxPoints,
              isCorrect: null
            };
          }

          default:
            return { status: 'incorrect', earnedScore: 0, maxScore: maxPoints, isCorrect: false };
        }
      },

      evaluateAttempt(questionsSnapshot, answersMap, passingScorePercent = 60, manualGrades = {}) {
        let earnedScore = 0;
        let autoGradableMaxScore = 0;
        let totalMaxScore = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let unansweredCount = 0;
        let pendingReviewCount = 0;
        const details = [];

        questionsSnapshot.forEach(q => {
          const userAns = answersMap[q.id];
          const res = this.gradeQuestion(q, userAns);
          totalMaxScore += res.maxScore;

          if (q.type === 'essay') {
            if (res.status === 'unanswered') {
              unansweredCount++;
              details.push({ questionId: q.id, userAnswer: userAns ?? null, ...res });
            } else if (manualGrades[q.id] !== undefined && manualGrades[q.id] !== null) {
              const mScore = Math.min(res.maxScore, Math.max(0, Number(manualGrades[q.id])));
              earnedScore += mScore;
              autoGradableMaxScore += res.maxScore;
              const isPassItem = mScore >= res.maxScore * 0.5;
              if (isPassItem) correctCount++; else incorrectCount++;
              details.push({
                questionId: q.id,
                userAnswer: userAns,
                status: isPassItem ? 'correct' : 'incorrect',
                earnedScore: mScore,
                maxScore: res.maxScore,
                isCorrect: isPassItem
              });
            } else {
              pendingReviewCount++;
              details.push({ questionId: q.id, userAnswer: userAns, ...res });
            }
          } else {
            autoGradableMaxScore += res.maxScore;
            earnedScore += res.earnedScore;
            if (res.status === 'correct') correctCount++;
            else if (res.status === 'unanswered') unansweredCount++;
            else incorrectCount++;
            details.push({ questionId: q.id, userAnswer: userAns ?? null, ...res });
          }
        });

        const denominator = autoGradableMaxScore > 0 ? autoGradableMaxScore : totalMaxScore;
        const percentage = denominator > 0 ? Number(((earnedScore / denominator) * 100).toFixed(2)) : 0;
        const passed = percentage >= Number(passingScorePercent);

        return {
          earnedScore: Number(earnedScore.toFixed(2)),
          totalScore: Number(totalMaxScore.toFixed(2)),
          autoGradableMaxScore: Number(autoGradableMaxScore.toFixed(2)),
          percentage,
          correctCount,
          incorrectCount,
          unansweredCount,
          pendingReviewCount,
          passed,
          details
        };
      }
    };

      async parseExamImportFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'json') {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (parsed.exportType === 'SINGLE_EXAM' && parsed.exam && Array.isArray(parsed.questions)) {
            return {
              exam: parsed.exam,
              questions: parsed.questions
            };
          } else if (parsed.title && Array.isArray(parsed.questions)) {
            return {
              exam: {
                title: parsed.title,
                subject: parsed.subject || 'ทั่วไป',
                category: parsed.category || 'ทั่วไป',
                description: parsed.description || '',
                timeLimitMinutes: Number(parsed.timeLimitMinutes || 40),
                passingScore: Number(parsed.passingScore || 60),
                difficulty: parsed.difficulty || 'medium'
              },
              questions: parsed.questions
            };
          }
          throw new Error('โครงสร้างไฟล์ JSON ไม่ตรงตามรูปแบบชุดข้อสอบ');
        } else if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
          const buffer = await file.arrayBuffer();
          const wb = XLSX.read(buffer, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet);
          if (!rows || rows.length === 0) throw new Error('ไม่พบข้อมูลคำถามในไฟล์');

          const questions = rows.map((r, idx) => {
            const qType = (r.type || 'multiple_choice').trim();
            const opts = [];
            if (r.optionA !== undefined && r.optionA !== '') opts.push({ key: 'A', text: String(r.optionA) });
            if (r.optionB !== undefined && r.optionB !== '') opts.push({ key: 'B', text: String(r.optionB) });
            if (r.optionC !== undefined && r.optionC !== '') opts.push({ key: 'C', text: String(r.optionC) });
            if (r.optionD !== undefined && r.optionD !== '') opts.push({ key: 'D', text: String(r.optionD) });
            if (r.optionE !== undefined && r.optionE !== '') opts.push({ key: 'E', text: String(r.optionE) });

            let correctAns = String(r.correctAnswer ?? '').trim();
            if (qType === 'true_false') {
              const lower = correctAns.toLowerCase();
              correctAns = (lower === 'true' || lower === 'ถูก' || lower === '1' || lower === 'a') ? 'true' : 'false';
            }

            return {
              id: Utils.uid('q'),
              order: idx + 1,
              type: qType,
              text: String(r.questionText || r.question || `คำถามข้อที่ ${idx + 1}`),
              options: qType === 'true_false'
                ? [{ key: 'true', text: 'ถูก (True)' }, { key: 'false', text: 'ผิด (False)' }]
                : opts,
              correctAnswer: correctAns,
              acceptableAnswers: qType === 'short_answer' || qType === 'fill_blank'
                ? correctAns.split('|').map(s => s.trim()).filter(Boolean)
                : undefined,
              score: Number(r.score || 1),
              difficulty: ['easy', 'medium', 'hard'].includes(r.difficulty) ? r.difficulty : 'medium',
              explanation: String(r.explanation || ''),
              notes: String(r.notes || '')
            };
          });

          const baseName = file.name.replace(/\.[^/.]+$/, '');
          return {
            exam: {
              title: baseName,
              subject: rows[0].subject || 'ทั่วไป',
              category: rows[0].category || 'ทั่วไป',
              description: `นำเข้าจากไฟล์ ${file.name}`,
              timeLimitMinutes: 40,
              passingScore: 60,
              difficulty: 'medium'
            },
            questions
          };
        }
        throw new Error('รองรับเฉพาะไฟล์ .json, .csv และ .xlsx เท่านั้น');
      }
    };

      async checkActiveAttemptOnBoot() {

      async startQuiz({
        examId = null,
        mode = 'exam', // 'exam' | 'practice' | 'review' | 'random' | 'mistake' | 'favorite'
        examineeName = '',
        customTitle = null,
        customQuestions = null,
        timeLimitMinutes = null,
        passingScore = null,
        answerDisplayMode = null,
        shuffleQuestions = false,
        shuffleOptions = false
      }) {
        // Check if another attempt is currently in progress
        const existingActive = await db.attempts.where('status').equals('in_progress').first();
        if (existingActive) {
          const proceed = await UI.confirm({
            title: 'มีชุดข้อสอบที่กำลังทำค้างไว้',
            message: `คุณกำลังทำข้อสอบ <b>"${Utils.escapeHTML(existingActive.examTitle)}"</b> ค้างอยู่ ต้องการยกเลิกชุดเดิมและเริ่มชุดใหม่หรือไม่?`,
            confirmText: 'เริ่มชุดใหม่',
            cancelText: 'กลับไปทำชุดเดิม',
            danger: true
          });
          if (!proceed) {
            App.resumeActiveAttempt();
            return;
          }
          await db.attempts.update(existingActive.id, { status: 'abandoned' });
        }

        const settings = await DBService.getSettings();
        let examObj = null;
        let questionsList = [];

        if (examId) {
          examObj = await db.exams.get(examId);
          if (!examObj) return UI.toast('ไม่พบชุดข้อสอบที่เลือก', 'error');
          questionsList = await db.questions.where('examId').equals(examId).sortBy('order');
        } else if (customQuestions) {
          questionsList = customQuestions;
        }

        if (!questionsList || questionsList.length === 0) {
          return UI.toast('ชุดข้อสอบนี้ยังไม่มีคำถาม กรุณาเพิ่มคำถามก่อนเริ่มทำข้อสอบ', 'warning');
        }

        // Deep clone snapshot so editing original exam never mutates historical attempt
        let snapshot = JSON.parse(JSON.stringify(questionsList));
        if (shuffleQuestions) {
          snapshot = Utils.shuffleArray(snapshot);
        }
        if (shuffleOptions) {
          snapshot = snapshot.map(q => {
            if ((q.type === 'multiple_choice' || q.type === 'multiple_select') && Array.isArray(q.options)) {
              return { ...q, options: Utils.shuffleArray(q.options) };
            }
            return q;
          });
        }

        const effectiveTimeLimit = mode === 'practice' || mode === 'review'
          ? 0
          : (timeLimitMinutes !== null ? Number(timeLimitMinutes) : Number(examObj?.timeLimitMinutes ?? settings.defaultExamTime));

        const now = new Date();
        const deadlineAt = effectiveTimeLimit > 0
          ? new Date(now.getTime() + effectiveTimeLimit * 60 * 1000).toISOString()
          : null;

        const attemptId = Utils.uid('att');
        const attemptRecord = {
          id: attemptId,
          examId: examObj ? examObj.id : null,
          examVersion: examObj ? (examObj.version || 1) : 1,
          examTitle: customTitle || examObj?.title || 'แบบทดสอบ',

          deadlineAt,
          submittedAt: null,
          durationSeconds: 0,
          status: mode === 'review' ? 'reviewing' : 'in_progress',
          currentIndex: 0,
          flaggedIds: [],
          answers: {},
          manualGrades: {},
          questionsSnapshot: snapshot,
          earnedScore: 0,
          totalScore: snapshot.reduce((sum, q) => sum + Number(q.score || 1), 0),
          percentage: 0,
          correctCount: 0,
          incorrectCount: 0,
          unansweredCount: snapshot.length,
          passed: false,
          submitType: null
        };

        await db.attempts.put(attemptRecord);
        this.notified5Min = false;
        this.notified1Min = false;
        this.submittingLock = false;

        document.getElementById('sidebar-resume-banner')?.classList.remove('hidden');
        App.navigate('quiz-player', { attemptId });

      async saveAnswer(attemptId, questionId, value) {
        const statusEl = document.getElementById('autosave-indicator');
        if (statusEl) {
          statusEl.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin text-[#E6A817]"></i> <span>Saving...</span>`;
          lucide.createIcons({ nodes: [statusEl] });
        }
        try {
          await db.transaction('rw', db.attempts, db.answers, async () => {
            const att = await db.attempts.get(attemptId);
            if (!att || att.status !== 'in_progress') {
              throw new Error('ไม่สามารถแก้ไขคำตอบได้ เนื่องจากการสอบสิ้นสุดแล้ว');
            }
            const updatedAnswers = { ...att.answers, [questionId]: value };
            await db.attempts.update(attemptId, { answers: updatedAnswers });
            await db.answers.put({
              id: `${attemptId}_${questionId}`,
              attemptId,
              questionId,
              value,
              updatedAt: new Date().toISOString()
            });
          });

          if (statusEl) {
            statusEl.innerHTML = `<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-[#0fb762]"></i> <span class="text-[#0B9951]">Saved</span>`;
            lucide.createIcons({ nodes: [statusEl] });
          }
          return true;
        } catch (err) {
          if (statusEl) {
            statusEl.innerHTML = `<i data-lucide="alert-circle" class="w-3.5 h-3.5 text-[#DC4B4B]"></i> <span class="text-[#DC4B4B]">Save Failed</span>`;
            lucide.createIcons({ nodes: [statusEl] });
          }
          UI.toast(err.message || 'บันทึกคำตอบไม่สำเร็จ', 'error');
          return false;
        }
      },

      async toggleFlag(attemptId, questionId) {
        const att = await db.attempts.get(attemptId);
        if (!att) return;
        const set = new Set(att.flaggedIds || []);
        if (set.has(questionId)) set.delete(questionId);
        else set.add(questionId);
        await db.attempts.update(attemptId, { flaggedIds: Array.from(set) });
      },

      async updateCurrentIndex(attemptId, index) {
        await db.attempts.update(attemptId, { currentIndex: index });
      },

      startCountdown(attempt, onTick, onExpire) {
        this.stopTimer();
        if (!attempt.deadlineAt || attempt.status !== 'in_progress') return;

        const deadlineMs = new Date(attempt.deadlineAt).getTime();

        const tick = () => {
          const nowMs = Date.now();
          const remainingSec = Math.max(0, Math.ceil((deadlineMs - nowMs) / 1000));
          onTick(remainingSec);

          if (App.state.settings.timerNotifications) {
            if (remainingSec <= 300 && remainingSec > 60 && !this.notified5Min && attempt.timeLimitMinutes > 5) {
              this.notified5Min = true;
              Utils.playTone('warning');
              UI.toast('แจ้งเตือน: เหลือเวลาทำข้อสอบอีก 5 นาที!', 'warning');
            }
            if (remainingSec <= 60 && remainingSec > 0 && !this.notified1Min && attempt.timeLimitMinutes > 1) {
              this.notified1Min = true;
              Utils.playTone('warning');
              UI.toast('แจ้งเตือนด่วน: เหลือเวลาอีกเพียง 1 นาที!', 'error');
            }
          }

          if (remainingSec <= 0) {
            this.stopTimer();
            onExpire();
          }
        };

        tick();
        this.timerInterval = setInterval(tick, 500);
      },

      async submitAttempt(attemptId, submitType = 'manual', silent = false) {
        if (this.submittingLock) return null;
        this.submittingLock = true;
        this.stopTimer();

        try {
          let finalizedAttempt = null;
          await db.transaction('rw', db.attempts, db.wrongAnswers, async () => {
            const att = await db.attempts.get(attemptId);
            if (!att) throw new Error('ไม่พบข้อมูลการสอบ');
            if (att.status === 'completed') {
              finalizedAttempt = att;
              return;
            }

            const now = new Date();
            const startedMs = new Date(att.startedAt).getTime();
            let durationSec = Math.max(1, Math.floor((now.getTime() - startedMs) / 1000));
            if (att.timeLimitMinutes > 0) {
              durationSec = Math.min(durationSec, att.timeLimitMinutes * 60);
            }

            const evalResult = ScoringEngine.evaluateAttempt(
              att.questionsSnapshot,
              att.answers || {},
              att.passingScore,
              att.manualGrades || {}
            );

            finalizedAttempt = {
              ...att,
              status: 'completed',
              submittedAt: now.toISOString(),
              durationSeconds: durationSec,
              submitType,
              earnedScore: evalResult.earnedScore,
              totalScore: evalResult.totalScore,
              percentage: evalResult.percentage,
              correctCount: evalResult.correctCount,
              incorrectCount: evalResult.incorrectCount,
              unansweredCount: evalResult.unansweredCount,
              pendingReviewCount: evalResult.pendingReviewCount,
              passed: evalResult.passed,
              gradingDetails: evalResult.details
            };

            await db.attempts.put(finalizedAttempt);

            // Auto-save incorrect questions into Wrong Answer Review store
            for (const detail of evalResult.details) {
              if (detail.status === 'incorrect') {
                const qObj = att.questionsSnapshot.find(q => q.id === detail.questionId);
                if (qObj) {
                  await db.wrongAnswers.put({
                    id: `wrong_${qObj.id}`,
                    questionId: qObj.id,
                    question: qObj,
                    lastUserAnswer: detail.userAnswer,
                    subject: qObj.subject || att.subject || 'ทั่วไป',
                    category: qObj.category || att.category || 'ทั่วไป',
                    reviewed: false,
                    updatedAt: now.toISOString()
                  });
                }
              }
            }
          });

          document.getElementById('sidebar-resume-banner')?.classList.add('hidden');
          if (!silent) {
            Utils.playTone('finish');
            UI.toast(
              submitType === 'auto_timeout'
                ? 'หมดเวลาสอบ! ระบบส่งข้อสอบและตรวจคะแนนอัตโนมัติเรียบร้อยแล้ว'
                : 'ส่งข้อสอบเรียบร้อยแล้ว',
              submitType === 'auto_timeout' ? 'warning' : 'success'
            );
          }
          return finalizedAttempt;
        } catch (err) {
          UI.toast(err.message || 'เกิดข้อผิดพลาดในการส่งข้อสอบ', 'error');
          return null;
        } finally {
          this.submittingLock = false;
        }
      }
    };

          const allMap = new Map();
          [...bankQuestions, ...examQuestions].forEach(q => {

            if (!allMap.has(key)) allMap.set(key, q);

          let pool = Array.from(allMap.values()).filter(q => {
            if (subj !== 'ALL' && q.subject !== subj) return false;
            if (cat !== 'ALL' && q.category !== cat) return false;
            if (diff !== 'ALL' && q.difficulty !== diff) return false;

      async duplicateExam(examId) {
        const exam = await db.exams.get(examId);
        if (!exam) return;
        const questions = await db.questions.where('examId').equals(examId).sortBy('order');
        const newExamId = Utils.uid('exam');
        const now = new Date().toISOString();

        await db.transaction('rw', db.exams, db.questions, async () => {
          await db.exams.put({
            ...exam,
            id: newExamId,
            title: `${exam.title} (สำเนา)`,
            version: 1,
            createdAt: now,
            updatedAt: now
          });
          const clonedQs = questions.map((q, idx) => ({
            ...q,
            id: Utils.uid('q'),
            examId: newExamId,
            order: idx + 1
          }));
          if (clonedQs.length > 0) await db.questions.bulkPut(clonedQs);
        });
        UI.toast('คัดลอกชุดข้อสอบสำเร็จ', 'success');
        App.navigate('my-exams');
      },

      async deleteExam(examId) {
        const exam = await db.exams.get(examId);
        if (!exam) return;
        const ok = await UI.confirm({
          title: 'ยืนยันการลบชุดข้อสอบ',
          message: `ต้องการลบชุดข้อสอบ <b>"${Utils.escapeHTML(exam.title)}"</b> ใช่หรือไม่? ข้อมูลคำถามในชุดนี้จะถูกลบออก แต่ประวัติผลสอบเก่าจะไม่สูญหาย`,
          confirmText: 'ลบชุดข้อสอบ',
          danger: true
        });
        if (!ok) return;
        await db.transaction('rw', db.exams, db.questions, async () => {
          await db.exams.delete(examId);
          await db.questions.where('examId').equals(examId).delete();
        });
        UI.toast('ลบชุดข้อสอบเรียบร้อยแล้ว', 'success');
        App.navigate('my-exams');
      },

                <div>
                  <h1 class="text-xl sm:text-2xl font-bold">${editExamId ? 'แก้ไขชุดข้อสอบ' : 'สร้างชุดข้อสอบใหม่'}</h1>
                  <p class="text-xs text-[#718278]">รองรับคำถาม 8 รูปแบบ กำหนดเวลาสอบแยกชุด และบันทึกเวอร์ชันอัตโนมัติ</p>
                </div>
                <div class="flex flex-wrap gap-2">
                  <button type="button" onclick="App.navigate('my-exams')" class="px-4 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-sm font-medium">ยกเลิก</button>
                  <button type="button" id="save-exam-top-btn" class="px-5 py-2 rounded-xl btn-primary text-sm font-semibold flex items-center gap-2 shadow-xs">
                    <i data-lucide="save" class="w-4 h-4"></i> บันทึกชุดข้อสอบ
                  </button>
                </div>
              </div>

              <!-- Section 1: Exam Information -->
              <div class="card-surface p-5 space-y-4">
                <div class="flex items-center justify-between border-b border-[#E5EEE8] dark:border-[#24382f] pb-3">
                  <h2 class="font-bold text-base flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-[#0fb762]"></i> ข้อมูลทั่วไปของชุดข้อสอบ (Exam Information)
                  </h2>
                  <span class="text-xs px-2.5 py-1 rounded-full bg-[#F7FBF8] dark:bg-[#16221d] text-[#0B9951] font-semibold">
                    รวม ${questionsList.length} ข้อ • ${totalScore} คะแนน
                  </span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="md:col-span-2">
                    <label class="block text-xs font-semibold mb-1">ชื่อชุดข้อสอบ (Exam Title) <span class="text-[#DC4B4B]">*</span></label>
                    <input type="text" id="ex-title" value="${Utils.escapeHTML(examData.title)}" placeholder="เช่น ภาษาไทย ชุดที่ 1 (หลักภาษาและการใช้ภาษา)"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm focus:outline-none focus:border-[#0fb762]" />
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">วิชา (เลือกหรือพิมพ์ชื่อวิชาใหม่ได้ทันที)</label>
                    <div class="flex gap-2">
                      <input type="text" id="ex-subject" list="subject-datalist" value="${Utils.escapeHTML(examData.subject)}" placeholder="พิมพ์ชื่อวิชา..."
                        class="flex-1 px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm focus:outline-none focus:border-[#0fb762]" />
                      <datalist id="subject-datalist">
                        ${subjects.map(s => `<option value="${Utils.escapeHTML(s.name)}"></option>`).join('')}
                      </datalist>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">หมวดหมู่ (Category)</label>
                    <input type="text" id="ex-category" list="category-datalist" value="${Utils.escapeHTML(examData.category)}" placeholder="เลือกหรือพิมพ์หมวดหมู่..."
                      class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm focus:outline-none focus:border-[#0fb762]" />
                    <datalist id="category-datalist">
                      ${categories.map(c => `<option value="${Utils.escapeHTML(c.name)}"></option>`).join('')}
                    </datalist>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">เวลาในการทำข้อสอบ (นาที)</label>
                    <input type="number" id="ex-time" value="${examData.timeLimitMinutes}" min="1" max="600"
                      class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">เกณฑ์คะแนนผ่าน (%)</label>
                    <input type="number" id="ex-passing" value="${examData.passingScore}" min="0" max="100"
                      class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">ระดับความยาก</label>
                    <select id="ex-difficulty" class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                      <option value="easy" ${examData.difficulty === 'easy' ? 'selected' : ''}>ง่าย (Easy)</option>
                      <option value="medium" ${examData.difficulty === 'medium' ? 'selected' : ''}>ปานกลาง (Medium)</option>
                      <option value="hard" ${examData.difficulty === 'hard' ? 'selected' : ''}>ยาก (Hard)</option>
                    </select>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold mb-1">รูปแบบการแสดงเฉลย</label>
                    <select id="ex-answer-display" class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                      <option value="after_submit" ${examData.answerDisplayMode === 'after_submit' ? 'selected' : ''}>แสดงเฉลยหลังส่งข้อสอบ</option>
                      <option value="immediate" ${examData.answerDisplayMode === 'immediate' ? 'selected' : ''}>แสดงเฉลยทันทีหลังตอบแต่ละข้อ</option>
                      <option value="never" ${examData.answerDisplayMode === 'never' ? 'selected' : ''}>ซ่อนเฉลย (แสดงเฉพาะคะแนน)</option>
                    </select>
                  </div>

                  <div class="md:col-span-2">
                    <label class="block text-xs font-semibold mb-1">คำอธิบาย / คำชี้แจงชุดข้อสอบ</label>
                    <textarea id="ex-description" rows="2" placeholder="ระบุรายละเอียดขอบเขตเนื้อหาหรือคำแนะนำสำหรับผู้เข้าสอบ..."
                      class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">${Utils.escapeHTML(examData.description || '')}</textarea>
                  </div>
                </div>
              </div>

              <!-- Section 2: Question List & Toolbar -->
              <div class="card-surface p-5 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#E5EEE8] dark:border-[#24382f] pb-3">
                  <div>
                    <h2 class="font-bold text-base flex items-center gap-2">
                      <i data-lucide="list-ordered" class="w-5 h-5 text-[#0fb762]"></i> รายการคำถามในชุดข้อสอบ (${questionsList.length} ข้อ)
                    </h2>
                    <p class="text-xs text-[#718278]">เพิ่มคำถามใหม่ ดึงจากคลังคำถาม หรือจัดเรียงลำดับข้อได้ตามต้องการ</p>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" id="import-from-bank-btn" class="px-3.5 py-2 rounded-xl border border-[#0fb762] text-[#0fb762] hover:bg-[#a1ffcf]/20 text-xs font-semibold flex items-center gap-1.5">
                      <i data-lucide="database" class="w-4 h-4"></i> ดึงจากคลังคำถาม
                    </button>
                    <button type="button" id="add-question-btn" class="px-4 py-2 rounded-xl btn-primary text-xs font-semibold flex items-center gap-1.5">
                      <i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มคำถามใหม่
                    </button>
                  </div>
                </div>

                ${questionsList.length === 0 ? `
                  <div class="text-center py-12 px-4 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] border border-dashed border-[#E5EEE8] dark:border-[#24382f]">
                    <i data-lucide="help-circle" class="w-10 h-10 text-[#0fb762] mx-auto mb-2"></i>
                    <p class="font-semibold text-sm">ยังไม่มีคำถามในชุดข้อสอบนี้</p>
                    <p class="text-xs text-[#718278] mt-1 mb-4">คลิก "เพิ่มคำถามใหม่" เพื่อสร้างข้อสอบปรนัย อัตนัย จับคู่ เรียงลำดับ หรือเติมคำ</p>
                    <button type="button" onclick="document.getElementById('add-question-btn').click()" class="px-4 py-2 rounded-xl btn-primary text-xs font-semibold">+ เพิ่มคำถามข้อที่ 1</button>
                  </div>
                ` : `
                  <div class="space-y-3">
                    ${questionsList.map((q, idx) => `
                      <div class="p-4 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8]/50 dark:bg-[#16221d]/50 flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                        <div class="space-y-1.5 flex-1 min-w-0">
                          <div class="flex flex-wrap items-center gap-2">
                            <span class="px-2.5 py-0.5 rounded-lg bg-[#0fb762] text-white text-xs font-bold">ข้อที่ ${idx + 1}</span>
                            <span class="text-xs px-2 py-0.5 rounded-md bg-white dark:bg-[#0f1714] border border-[#E5EEE8] dark:border-[#24382f] font-medium">${Utils.questionTypeLabel(q.type)}</span>
                            <span class="text-xs font-semibold text-[#0B9951]">${q.score || 1} คะแนน</span>
                            ${Utils.difficultyBadge(q.difficulty)}
                          </div>
                          <div class="font-medium text-sm text-[#173B2B] dark:text-white pt-1">${Utils.escapeHTML(q.text)}</div>
                          ${q.explanation ? `<div class="text-xs text-[#718278] flex items-center gap-1"><i data-lucide="lightbulb" class="w-3.5 h-3.5 text-[#E6A817]"></i> มีคำอธิบายเฉลย</div>` : ''}
                        </div>
                        <div class="flex items-center gap-1 shrink-0 self-end sm:self-start">
                          <button type="button" data-q-up="${idx}" ${idx === 0 ? 'disabled' : ''} class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] disabled:opacity-30" title="เลื่อนขึ้น"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                          <button type="button" data-q-down="${idx}" ${idx === questionsList.length - 1 ? 'disabled' : ''} class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] disabled:opacity-30" title="เลื่อนลง"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                          <button type="button" data-q-dup="${idx}" class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f]" title="ทำสำเนาข้อ"><i data-lucide="copy" class="w-4 h-4"></i></button>
                          <button type="button" data-q-edit="${idx}" class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] text-[#0fb762]" title="แก้ไขคำถาม"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                          <button type="button" data-q-del="${idx}" class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] text-[#DC4B4B]" title="ลบคำถาม"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <!-- Bottom Save Bar -->
              <div class="flex justify-end gap-3">
                <button type="button" onclick="App.navigate('my-exams')" class="px-5 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-sm font-medium">ยกเลิก</button>
                <button type="button" id="save-exam-bottom-btn" class="px-6 py-2.5 rounded-xl btn-primary text-sm font-semibold flex items-center gap-2 shadow-sm">
                  <i data-lucide="save" class="w-4 h-4"></i> บันทึกชุดข้อสอบทั้งหมด
                </button>
              </div>
            </div>
          `;

          const syncFormState = () => {
            examData.title = document.getElementById('ex-title').value.trim();
            examData.subject = document.getElementById('ex-subject').value.trim() || 'ทั่วไป';
            examData.category = document.getElementById('ex-category').value.trim() || 'ทั่วไป';
            examData.timeLimitMinutes = Math.max(1, Number(document.getElementById('ex-time').value || 40));
            examData.passingScore = Math.min(100, Math.max(0, Number(document.getElementById('ex-passing').value || 60)));
            examData.difficulty = document.getElementById('ex-difficulty').value;
            examData.answerDisplayMode = document.getElementById('ex-answer-display').value;
            examData.description = document.getElementById('ex-description').value.trim();
          };

          document.getElementById('add-question-btn').onclick = () => {
            syncFormState();
            this.openQuestionEditorModal(null, examData, (savedQ) => {
              questionsList.push(savedQ);
              renderEditor();
            });
          };

          document.getElementById('import-from-bank-btn').onclick = async () => {
            syncFormState();
            const bankQs = await db.questionBank.toArray();
            if (bankQs.length === 0) {
              return UI.toast('ยังไม่มีคำถามในคลังคำถามส่วนกลาง', 'warning');
            }
            UI.openModal(`
              <div class="p-5 border-b border-[#E5EEE8] dark:border-[#24382f] flex items-center justify-between">
                <h3 class="font-bold text-base">เลือกคำถามจากคลังส่วนกลาง (${bankQs.length} ข้อ)</h3>
                <button onclick="UI.closeModal()" class="p-1 text-[#718278]"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>
              <div class="p-4 overflow-y-auto space-y-2 max-h-96">
                ${bankQs.map(bq => `
                  <label class="flex items-start gap-3 p-3 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] hover:bg-[#F7FBF8] dark:hover:bg-[#16221d] cursor-pointer">
                    <input type="checkbox" value="${bq.id}" class="bank-pick-cb mt-1 rounded text-[#0fb762]" />
                    <div class="text-sm">
                      <div class="font-medium">${Utils.escapeHTML(bq.text)}</div>
                      <div class="text-xs text-[#718278] mt-0.5">${Utils.escapeHTML(bq.subject)} • ${Utils.questionTypeLabel(bq.type)}</div>
                    </div>
                  </label>
                `).join('')}
              </div>
              <div class="p-4 border-t border-[#E5EEE8] dark:border-[#24382f] flex justify-end gap-2">
                <button onclick="UI.closeModal()" class="px-4 py-2 rounded-xl border text-sm">ปิด</button>
                <button id="confirm-bank-pick" class="px-4 py-2 rounded-xl btn-primary text-sm font-semibold">เพิ่มข้อที่เลือก</button>
              </div>
            `, 'max-w-2xl');

            document.getElementById('confirm-bank-pick').onclick = () => {
              const checkedIds = Array.from(document.querySelectorAll('.bank-pick-cb:checked')).map(el => el.value);
              checkedIds.forEach(id => {
                const found = bankQs.find(b => b.id === id);
                if (found) {
                  questionsList.push({
                    ...JSON.parse(JSON.stringify(found)),
                    id: Utils.uid('q'),
                    examId: examData.id
                  });
                }
              });
              UI.closeModal();
              renderEditor();
              UI.toast(`นำเข้าคำถาม ${checkedIds.length} ข้อสำเร็จ`, 'success');
            };
          };

          container.querySelectorAll('[data-q-up]').forEach(btn => {
            btn.onclick = () => {
              syncFormState();
              const i = Number(btn.getAttribute('data-q-up'));
              if (i > 0) {
                [questionsList[i - 1], questionsList[i]] = [questionsList[i], questionsList[i - 1]];
                renderEditor();
              }
            };
          });
          container.querySelectorAll('[data-q-down]').forEach(btn => {
            btn.onclick = () => {
              syncFormState();
              const i = Number(btn.getAttribute('data-q-down'));
              if (i < questionsList.length - 1) {
                [questionsList[i + 1], questionsList[i]] = [questionsList[i], questionsList[i + 1]];
                renderEditor();
              }
            };
          });
          container.querySelectorAll('[data-q-dup]').forEach(btn => {
            btn.onclick = () => {
              syncFormState();
              const i = Number(btn.getAttribute('data-q-dup'));
              const copy = JSON.parse(JSON.stringify(questionsList[i]));
              copy.id = Utils.uid('q');
              questionsList.splice(i + 1, 0, copy);
              renderEditor();
            };
          });
          container.querySelectorAll('[data-q-edit]').forEach(btn => {
            btn.onclick = () => {
              syncFormState();
              const i = Number(btn.getAttribute('data-q-edit'));
              this.openQuestionEditorModal(questionsList[i], examData, (updatedQ) => {
                questionsList[i] = updatedQ;
                renderEditor();
              });
            };
          });
          container.querySelectorAll('[data-q-del]').forEach(btn => {
            btn.onclick = () => {
              syncFormState();
              const i = Number(btn.getAttribute('data-q-del'));
              questionsList.splice(i, 1);
              renderEditor();
            };
          });

          const saveFullExam = async () => {
            syncFormState();
            if (!examData.title) {
              return UI.toast('กรุณาระบุชื่อชุดข้อสอบก่อนบันทึก', 'error');
            }
            if (questionsList.length === 0) {
              return UI.toast('กรุณาเพิ่มคำถามอย่างน้อย 1 ข้อในชุดข้อสอบ', 'warning');
            }

            const now = new Date().toISOString();
            const computedTotalScore = questionsList.reduce((s, q) => s + Number(q.score || 1), 0);
            const nextVersion = editExamId ? (Number(examData.version || 1) + 1) : 1;

            const finalExam = {
              ...examData,
              questionCount: questionsList.length,
              totalScore: computedTotalScore,
              version: nextVersion,
              createdAt: examData.createdAt || now,
              updatedAt: now
            };

            const finalQuestions = questionsList.map((q, idx) => ({
              ...q,
              id: q.id || Utils.uid('q'),
              examId: finalExam.id,
              order: idx + 1,
              subject: q.subject || finalExam.subject,
              category: q.category || finalExam.category
            }));

            try {
              await db.transaction('rw', db.exams, db.questions, db.subjects, db.categories, async () => {
                await db.exams.put(finalExam);
                await db.questions.where('examId').equals(finalExam.id).delete();
                await db.questions.bulkPut(finalQuestions);

                // Save custom subject if new
                const existingSubj = await db.subjects.where('name').equals(finalExam.subject).first();
                if (!existingSubj) {
                  await db.subjects.put({ id: Utils.uid('subj'), name: finalExam.subject, isDefault: false });
                }
                // Save custom category if new
                const existingCat = await db.categories.where('name').equals(finalExam.category).first();
                if (!existingCat) {
                  await db.categories.put({ id: Utils.uid('cat'), name: finalExam.category, color: '#0fb762', icon: 'folder' });
                }
              });

              UI.toast(`บันทึกชุดข้อสอบ "${finalExam.title}" (v.${nextVersion}) สำเร็จ!`, 'success');
              App.navigate('my-exams');
            } catch (err) {
              UI.toast('เกิดข้อผิดพลาดในการบันทึกข้อมูลลง IndexedDB: ' + err.message, 'error');
            }
          };

          document.getElementById('save-exam-top-btn').onclick = saveFullExam;
          document.getElementById('save-exam-bottom-btn').onclick = saveFullExam;
          lucide.createIcons({ nodes: [container] });
        };

        renderEditor();
      },

      openQuestionEditorModal(existingQuestion, contextExam, onSave) {
        const q = existingQuestion ? JSON.parse(JSON.stringify(existingQuestion)) : {
          id: Utils.uid('q'),
          type: 'multiple_choice',
          text: '',
          options: [
            { key: 'A', text: '' },
            { key: 'B', text: '' },
            { key: 'C', text: '' },
            { key: 'D', text: '' }
          ],
          correctAnswer: 'A',
          acceptableAnswers: [''],
          caseSensitive: false,
          pairs: [{ left: '', right: '' }, { left: '', right: '' }],
          items: ['', '', ''],
          score: 1,
          difficulty: contextExam?.difficulty || 'medium',
          subject: contextExam?.subject || 'ทั่วไป',
          category: contextExam?.category || 'ทั่วไป',
          explanation: '',
          notes: ''
        };

        const renderModalBody = () => {
          let dynamicFieldsHTML = '';

          if (q.type === 'multiple_choice' || q.type === 'multiple_select') {
            const isMulti = q.type === 'multiple_select';
            const selectedSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer]);
            dynamicFieldsHTML = `
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <label class="text-xs font-semibold">ตัวเลือกและเฉลย (${isMulti ? 'เลือกได้หลายข้อที่ถูกต้อง' : 'เลือก 1 ข้อที่ถูกต้อง'})</label>
                  <button type="button" id="qe-add-opt" class="text-xs font-semibold text-[#0fb762] hover:underline">+ เพิ่มตัวเลือก</button>
                </div>
                <div class="space-y-2">
                  ${q.options.map((opt, idx) => `
                    <div class="flex items-center gap-2">
                      <input type="${isMulti ? 'checkbox' : 'radio'}" name="qe-correct-opt" value="${opt.key}" ${selectedSet.has(opt.key) ? 'checked' : ''}
                        class="w-4 h-4 text-[#0fb762] focus:ring-[#0fb762]" title="ตั้งเป็นเฉลย" />
                      <span class="w-7 h-7 rounded-lg bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f] flex items-center justify-center text-xs font-bold shrink-0">${opt.key}</span>
                      <input type="text" data-opt-idx="${idx}" value="${Utils.escapeHTML(opt.text)}" placeholder="ข้อความตัวเลือก ${opt.key}"

                    </div>

          } else if (q.type === 'true_false') {

                  <label class="flex items-center gap-2 p-3 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] cursor-pointer">
                    <input type="radio" name="qe-tf" value="false" ${q.correctAnswer === 'false' ? 'checked' : ''} class="text-[#0fb762]" />

                  </label>
                </div>
              </div>
            `;
          } else if (q.type === 'short_answer' || q.type === 'fill_blank') {
            const ansText = Array.isArray(q.acceptableAnswers) && q.acceptableAnswers.length > 0
              ? q.acceptableAnswers.join(' | ')
              : (q.correctAnswer || '');
            dynamicFieldsHTML = `
              <div class="space-y-2">
                <label class="block text-xs font-semibold">คำตอบที่ยอมรับได้ (หากมีหลายรูปแบบให้คั่นด้วยเครื่องหมาย | )</label>
                <input type="text" id="qe-short-ans" value="${Utils.escapeHTML(ansText)}" placeholder="เช่น กรุงเทพมหานคร | กรุงเทพฯ | กทม."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm" />
                <label class="flex items-center gap-2 text-xs text-[#718278] pt-1">
                  <input type="checkbox" id="qe-case-sensitive" ${q.caseSensitive ? 'checked' : ''} class="rounded text-[#0fb762]" />
                  <span>คำนึงถึงตัวพิมพ์ใหญ่-เล็กภาษาอังกฤษ (Case Sensitive)</span>
                </label>
              </div>
            `;
          } else if (q.type === 'matching') {
            const pairs = q.pairs || [{ left: '', right: '' }, { left: '', right: '' }];
            dynamicFieldsHTML = `
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <label class="text-xs font-semibold">คู่คำถาม - คำตอบที่ถูกต้อง (Matching Pairs)</label>
                  <button type="button" id="qe-add-pair" class="text-xs font-semibold text-[#0fb762] hover:underline">+ เพิ่มคู่</button>
                </div>
                <div class="space-y-2">
                  ${pairs.map((p, idx) => `
                    <div class="grid grid-cols-11 gap-2 items-center">
                      <input type="text" data-pair-left="${idx}" value="${Utils.escapeHTML(p.left)}" placeholder="ฝั่งซ้าย ${idx + 1}"
                        class="col-span-5 px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm" />
                      <div class="col-span-1 text-center text-[#718278]">→</div>
                      <input type="text" data-pair-right="${idx}" value="${Utils.escapeHTML(p.right)}" placeholder="คำตอบที่คู่กัน ${idx + 1}"
                        class="col-span-4 px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm" />
                      ${pairs.length > 2 ? `<button type="button" data-del-pair="${idx}" class="col-span-1 text-[#DC4B4B] flex justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          } else if (q.type === 'ordering') {
            const items = q.items || ['', '', ''];
            dynamicFieldsHTML = `
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <label class="text-xs font-semibold">ลำดับที่ถูกต้องจากบนลงล่าง (1 → N)</label>
                  <button type="button" id="qe-add-order" class="text-xs font-semibold text-[#0fb762] hover:underline">+ เพิ่มลำดับ</button>
                </div>
                <div class="space-y-2">
                  ${items.map((it, idx) => `
                    <div class="flex items-center gap-2">
                      <span class="w-7 h-7 rounded-lg bg-[#0fb762]/15 text-[#0B9951] flex items-center justify-center text-xs font-bold">${idx + 1}</span>
                      <input type="text" data-order-idx="${idx}" value="${Utils.escapeHTML(it)}" placeholder="รายการลำดับที่ ${idx + 1}"
                        class="flex-1 px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm" />
                      ${items.length > 2 ? `<button type="button" data-del-order="${idx}" class="p-1 text-[#DC4B4B]"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
