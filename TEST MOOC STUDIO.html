                  `).join('')}
                </div>
              </div>
            `;
          } else if (q.type === 'essay') {
            dynamicFieldsHTML = `
              <div class="p-3 rounded-xl bg-[#c6ec44]/25 border border-[#c6ec44] text-xs text-[#173B2B]">
                <b>หมายเหตุสำหรับข้อสอบอัตนัย (Essay):</b> ระบบจะบันทึกคำตอบของผู้สอบไว้ในสถานะ "รอตรวจ" และให้ผู้สอนตรวจให้คะแนนด้วยตนเองในหน้าทบทวนผลสอบ
              </div>
            `;
          }

          UI.openModal(`
            <div class="p-5 border-b border-[#E5EEE8] dark:border-[#24382f] flex items-center justify-between">
              <h3 class="font-bold text-base">${existingQuestion ? 'แก้ไขคำถาม' : 'เพิ่มคำถามใหม่'}</h3>
              <button onclick="UI.closeModal()" class="p-1 text-[#718278]"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold mb-1">ประเภทคำถาม (Question Type)</label>
                  <select id="qe-type" class="w-full px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm">
                    <option value="multiple_choice" ${q.type === 'multiple_choice' ? 'selected' : ''}>1. Multiple Choice (ปรนัย 1 คำตอบ)</option>
                    <option value="multiple_select" ${q.type === 'multiple_select' ? 'selected' : ''}>2. Multiple Select (ปรนัยหลายคำตอบ)</option>
                    <option value="true_false" ${q.type === 'true_false' ? 'selected' : ''}>3. True / False (ถูก / ผิด)</option>
                    <option value="short_answer" ${q.type === 'short_answer' ? 'selected' : ''}>4. Short Answer (ตอบสั้น)</option>
                    <option value="fill_blank" ${q.type === 'fill_blank' ? 'selected' : ''}>5. Fill in the Blank (เติมคำ)</option>
                    <option value="matching" ${q.type === 'matching' ? 'selected' : ''}>6. Matching (จับคู่)</option>
                    <option value="ordering" ${q.type === 'ordering' ? 'selected' : ''}>7. Ordering (เรียงลำดับ)</option>
                    <option value="essay" ${q.type === 'essay' ? 'selected' : ''}>8. Essay (อัตนัย - ตรวจเอง)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">คะแนนข้อนี้</label>
                  <input type="number" id="qe-score" value="${q.score || 1}" min="0.5" step="0.5"
                    class="w-full px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1">โจทย์คำถาม (Question Text) <span class="text-[#DC4B4B]">*</span></label>
                <textarea id="qe-text" rows="3" placeholder="พิมพ์โจทย์คำถามที่นี่..."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm">${Utils.escapeHTML(q.text)}</textarea>
              </div>

              ${dynamicFieldsHTML}

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-[#E5EEE8] dark:border-[#24382f]">
                <div>
                  <label class="block text-xs font-semibold mb-1">ระดับความยาก</label>
                  <select id="qe-difficulty" class="w-full px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm">
                    <option value="easy" ${q.difficulty === 'easy' ? 'selected' : ''}>ง่าย</option>
                    <option value="medium" ${q.difficulty === 'medium' ? 'selected' : ''}>ปานกลาง</option>
                    <option value="hard" ${q.difficulty === 'hard' ? 'selected' : ''}>ยาก</option>
                  </select>
                </div>
                <div class="flex items-end">
                  <label class="flex items-center gap-2 text-xs font-medium cursor-pointer pb-2">
                    <input type="checkbox" id="qe-save-to-bank" ${!existingQuestion ? 'checked' : ''} class="rounded text-[#0fb762]" />
                    <span>สำเนาคำถามนี้เก็บในคลังคำถามส่วนกลางด้วย</span>
                  </label>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1">คำอธิบายเฉลย (Explanation)</label>
                <textarea id="qe-explanation" rows="2" placeholder="อธิบายเหตุผลว่าทำไมคำตอบนี้จึงถูกต้อง..."
                  class="w-full px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm">${Utils.escapeHTML(q.explanation || '')}</textarea>
              </div>
            </div>
            <div class="p-4 bg-[#F7FBF8] dark:bg-[#16221d] border-t border-[#E5EEE8] dark:border-[#24382f] flex justify-end gap-2">
              <button type="button" onclick="UI.closeModal()" class="px-4 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#0f1714] text-sm">ยกเลิก</button>
              <button type="button" id="qe-save-btn" class="px-5 py-2 rounded-xl btn-primary text-sm font-semibold">บันทึกคำถาม</button>
            </div>
          `, 'max-w-2xl');

          const captureCurrentInputs = () => {
            q.text = document.getElementById('qe-text').value;
            q.score = Number(document.getElementById('qe-score').value || 1);
            q.difficulty = document.getElementById('qe-difficulty').value;
            q.explanation = document.getElementById('qe-explanation').value;

            if (q.type === 'multiple_choice' || q.type === 'multiple_select') {
              document.querySelectorAll('[data-opt-idx]').forEach(inp => {
                const idx = Number(inp.getAttribute('data-opt-idx'));
                if (q.options[idx]) q.options[idx].text = inp.value;
              });
              const checked = Array.from(document.querySelectorAll('input[name="qe-correct-opt"]:checked')).map(el => el.value);
              q.correctAnswer = q.type === 'multiple_select' ? checked : (checked[0] || 'A');
            } else if (q.type === 'true_false') {
              const tf = document.querySelector('input[name="qe-tf"]:checked');
              q.correctAnswer = tf ? tf.value : 'true';
              q.options = [{ key: 'true', text: 'ถูก (True)' }, { key: 'false', text: 'ผิด (False)' }];
            } else if (q.type === 'short_answer' || q.type === 'fill_blank') {
              const raw = document.getElementById('qe-short-ans')?.value || '';
              q.acceptableAnswers = raw.split('|').map(s => s.trim()).filter(Boolean);
              q.correctAnswer = q.acceptableAnswers[0] || '';
              q.caseSensitive = Boolean(document.getElementById('qe-case-sensitive')?.checked);
            } else if (q.type === 'matching') {
              document.querySelectorAll('[data-pair-left]').forEach(inp => {
                const idx = Number(inp.getAttribute('data-pair-left'));
                if (q.pairs[idx]) q.pairs[idx].left = inp.value;
              });
              document.querySelectorAll('[data-pair-right]').forEach(inp => {
                const idx = Number(inp.getAttribute('data-pair-right'));
                if (q.pairs[idx]) q.pairs[idx].right = inp.value;
              });
            } else if (q.type === 'ordering') {
              document.querySelectorAll('[data-order-idx]').forEach(inp => {
                const idx = Number(inp.getAttribute('data-order-idx'));
                q.items[idx] = inp.value;
              });
            }
          };

          document.getElementById('qe-type').onchange = (e) => {
            captureCurrentInputs();
            q.type = e.target.value;
            if ((q.type === 'multiple_choice' || q.type === 'multiple_select') && (!q.options || q.options.length < 2)) {
              q.options = [{ key: 'A', text: '' }, { key: 'B', text: '' }, { key: 'C', text: '' }, { key: 'D', text: '' }];
              q.correctAnswer = q.type === 'multiple_select' ? ['A'] : 'A';
            }
            if (q.type === 'true_false') q.correctAnswer = 'true';
            if (q.type === 'matching' && (!q.pairs || q.pairs.length < 2)) q.pairs = [{ left: '', right: '' }, { left: '', right: '' }];
            if (q.type === 'ordering' && (!q.items || q.items.length < 2)) q.items = ['', '', ''];
            renderModalBody();
          };

          document.getElementById('qe-add-opt')?.addEventListener('click', () => {
            captureCurrentInputs();
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const nextKey = letters[q.options.length] || String(q.options.length + 1);
            q.options.push({ key: nextKey, text: '' });
            renderModalBody();
          });

          document.querySelectorAll('[data-del-opt]').forEach(btn => {
            btn.onclick = () => {
              captureCurrentInputs();
              const idx = Number(btn.getAttribute('data-del-opt'));
              q.options.splice(idx, 1);
              const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
              q.options = q.options.map((o, i) => ({ ...o, key: letters[i] || String(i + 1) }));
              renderModalBody();
            };
          });

          document.getElementById('qe-add-pair')?.addEventListener('click', () => {
            captureCurrentInputs();
            q.pairs.push({ left: '', right: '' });
            renderModalBody();
          });
          document.querySelectorAll('[data-del-pair]').forEach(btn => {
            btn.onclick = () => {
              captureCurrentInputs();
              q.pairs.splice(Number(btn.getAttribute('data-del-pair')), 1);
              renderModalBody();
            };
          });

          document.getElementById('qe-add-order')?.addEventListener('click', () => {
            captureCurrentInputs();
            q.items.push('');
            renderModalBody();
          });
          document.querySelectorAll('[data-del-order]').forEach(btn => {
            btn.onclick = () => {
              captureCurrentInputs();
              q.items.splice(Number(btn.getAttribute('data-del-order')), 1);
              renderModalBody();
            };
          });

          document.getElementById('qe-save-btn').onclick = async () => {
            captureCurrentInputs();
            if (!q.text.trim()) {
              return UI.toast('กรุณากรอกโจทย์คำถาม', 'error');
            }
            if (q.type === 'multiple_choice' || q.type === 'multiple_select') {
              if (q.options.some(o => !o.text.trim())) {
                return UI.toast('กรุณากรอกข้อความตัวเลือกให้ครบทุกข้อ', 'error');
              }
              if (q.type === 'multiple_select' && (!Array.isArray(q.correctAnswer) || q.correctAnswer.length === 0)) {
                return UI.toast('กรุณาเลือกคำตอบที่ถูกต้องอย่างน้อย 1 ข้อ', 'error');
              }
            }
            if ((q.type === 'short_answer' || q.type === 'fill_blank') && (!q.acceptableAnswers || q.acceptableAnswers.length === 0)) {
              return UI.toast('กรุณาระบุเฉลยคำตอบอย่างน้อย 1 รูปแบบ', 'error');
            }
            if (q.type === 'matching' && q.pairs.some(p => !p.left.trim() || !p.right.trim())) {
              return UI.toast('กรุณากรอกคู่คำถามและคำตอบให้ครบทุกช่อง', 'error');
            }
            if (q.type === 'ordering' && q.items.some(it => !it.trim())) {
              return UI.toast('กรุณากรอกรายการเรียงลำดับให้ครบทุกข้อ', 'error');
            }

            if (document.getElementById('qe-save-to-bank')?.checked) {
              await db.questionBank.put({
                ...JSON.parse(JSON.stringify(q)),
                id: Utils.uid('bank'),
                createdAt: new Date().toISOString()
              });
            }

            UI.closeModal();
            onSave(q);
          };
        };

        renderModalBody();
      },

      /* --------------------------------------------------------------------------
       * VIEW 4: QUIZ PLAYER (Countdown Timer, Auto-Save, Flagging, Navigator)
       * -------------------------------------------------------------------------- */
      async renderQuizPlayer(container, attemptId) {
        const attempt = await db.attempts.get(attemptId);
        if (!attempt) {
          UI.toast('ไม่พบข้อมูลห้องสอบ', 'error');
          return App.navigate('my-exams');
        }

        if (attempt.status === 'completed') {
          return App.navigate('quiz-result', { attemptId });
        }

        // Check immediate deadline expiration on resume
        if (attempt.deadlineAt && Date.now() >= new Date(attempt.deadlineAt).getTime()) {
          const submitted = await QuizEngine.submitAttempt(attemptId, 'auto_timeout');
          if (submitted) return App.navigate('quiz-result', { attemptId });
        }

        const questions = attempt.questionsSnapshot || [];
        let currentIndex = Math.min(attempt.currentIndex || 0, questions.length - 1);
        const answers = attempt.answers || {};
        const flaggedSet = new Set(attempt.flaggedIds || []);
        const favoriteRows = await db.favorites.toArray();
        const favoriteSet = new Set(favoriteRows.map(f => f.questionId));
        const isReviewMode = attempt.mode === 'review';

        const renderQuestionStage = () => {
          const q = questions[currentIndex];
          const userAns = answers[q.id];
          const isFlagged = flaggedSet.has(q.id);
          const isFav = favoriteSet.has(q.id);
          const answeredCount = questions.filter(item => {
            const v = answers[item.id];
            return v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && v.length === 0);
          }).length;
          const progressPct = Math.round((answeredCount / questions.length) * 100);

          let answerInputHTML = '';
          if (q.type === 'multiple_choice' || q.type === 'true_false') {
            const opts = q.type === 'true_false'
              ? [{ key: 'true', text: 'ถูก (True)' }, { key: 'false', text: 'ผิด (False)' }]
              : (q.options || []);
            answerInputHTML = `
              <div class="space-y-2.5">
                ${opts.map(opt => {
                  const selected = String(userAns) === String(opt.key);
                  return `
                    <button type="button" data-pick-single="${Utils.escapeHTML(opt.key)}" ${isReviewMode ? 'disabled' : ''}
                      class="w-full text-left p-3.5 sm:p-4 rounded-xl border-2 transition flex items-center gap-3 ${
                        selected
                          ? 'border-[#0fb762] bg-[#a1ffcf]/25 dark:bg-[#0fb762]/20'
                          : 'border-[#E5EEE8] dark:border-[#24382f] hover:border-[#0fb762]/60 bg-white dark:bg-[#0f1714]'
                      }">
                      <span class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shrink-0 ${
                        selected ? 'bg-[#0fb762] text-white' : 'bg-[#F7FBF8] dark:bg-[#16221d] text-[#40564A] dark:text-gray-300'
                      }">${Utils.escapeHTML(opt.key === 'true' ? 'T' : opt.key === 'false' ? 'F' : opt.key)}</span>
                      <span class="text-sm sm:text-base font-medium text-[#173B2B] dark:text-white">${Utils.escapeHTML(opt.text)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `;
          } else if (q.type === 'multiple_select') {
            const selectedArr = Array.isArray(userAns) ? userAns.map(String) : [];
            answerInputHTML = `
              <div class="space-y-2.5">
                <div class="text-xs text-[#0B9951] font-semibold">เลือกได้มากกว่า 1 ข้อ</div>
                ${(q.options || []).map(opt => {
                  const selected = selectedArr.includes(String(opt.key));
                  return `
                    <button type="button" data-pick-multi="${Utils.escapeHTML(opt.key)}" ${isReviewMode ? 'disabled' : ''}
                      class="w-full text-left p-3.5 rounded-xl border-2 transition flex items-center gap-3 ${
                        selected
                          ? 'border-[#0fb762] bg-[#a1ffcf]/25 dark:bg-[#0fb762]/20'
                          : 'border-[#E5EEE8] dark:border-[#24382f] hover:border-[#0fb762]/60 bg-white dark:bg-[#0f1714]'
                      }">
                      <span class="w-6 h-6 rounded-md border flex items-center justify-center shrink-0 ${
                        selected ? 'bg-[#0fb762] border-[#0fb762] text-white' : 'border-[#718278]'
                      }">
                        ${selected ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
                      </span>
                      <span class="font-bold text-xs text-[#718278]">${Utils.escapeHTML(opt.key)}.</span>
                      <span class="text-sm sm:text-base font-medium text-[#173B2B] dark:text-white">${Utils.escapeHTML(opt.text)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `;
          } else if (q.type === 'short_answer' || q.type === 'fill_blank') {
            answerInputHTML = `
              <div class="space-y-2">
                <label class="block text-xs font-semibold text-[#718278]">พิมพ์คำตอบของคุณลงในช่องด้านล่าง:</label>
                <input type="text" id="qp-text-input" value="${Utils.escapeHTML(userAns || '')}" ${isReviewMode ? 'disabled' : ''}

          } else if (q.type === 'matching') {

            answerInputHTML = `
              <div class="space-y-3">
                <div class="text-xs text-[#718278]">เลือกจับคู่คำตอบฝั่งขวาให้ตรงกับข้อความฝั่งซ้าย</div>
                ${pairs.map((p, idx) => `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 p-3 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f] items-center">
                    <div class="text-sm font-semibold text-[#173B2B] dark:text-white">${idx + 1}. ${Utils.escapeHTML(p.left)}</div>
                    <select data-match-idx="${idx}" ${isReviewMode ? 'disabled' : ''}
                      class="px-3 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#0f1714] text-sm">
                      <option value="">-- เลือกคำตอบที่คู่กัน --</option>
                      ${rightOptions.map(ro => `<option value="${Utils.escapeHTML(ro)}" ${String(currentMatch[idx]) === String(ro) ? 'selected' : ''}>${Utils.escapeHTML(ro)}</option>`).join('')}
                    </select>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (q.type === 'ordering') {
            const currentOrder = Array.isArray(userAns) && userAns.length === (q.items || []).length
              ? userAns
              : Utils.shuffleArray(q.items || []);
            if (!Array.isArray(userAns) && !isReviewMode) {
              answers[q.id] = currentOrder;
              QuizEngine.saveAnswer(attemptId, q.id, currentOrder);
            }
            answerInputHTML = `
              <div class="space-y-2">
                <div class="text-xs text-[#718278]">จัดเรียงลำดับให้ถูกต้องจากข้อ 1 ลงไปด้านล่าง</div>
                ${currentOrder.map((itemText, idx) => `
                  <div class="flex items-center justify-between gap-2 p-3 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#0f1714]">
                    <div class="flex items-center gap-3">
                      <span class="w-7 h-7 rounded-lg bg-[#0fb762]/15 text-[#0B9951] font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                      <span class="text-sm font-medium">${Utils.escapeHTML(itemText)}</span>
                    </div>
                    ${!isReviewMode ? `
                      <div class="flex gap-1">
                        <button type="button" data-ord-move-up="${idx}" ${idx === 0 ? 'disabled' : ''} class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] disabled:opacity-30"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                        <button type="button" data-ord-move-down="${idx}" ${idx === currentOrder.length - 1 ? 'disabled' : ''} class="p-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] disabled:opacity-30"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            `;
          } else if (q.type === 'essay') {
            answerInputHTML = `
              <div class="space-y-2">
                <label class="block text-xs font-semibold text-[#718278]">เขียนคำตอบอธิบายอย่างละเอียด:</label>
                <textarea id="qp-essay-input" rows="6" ${isReviewMode ? 'disabled' : ''} placeholder="พิมพ์คำตอบอัตนัยของคุณที่นี่..."
                  class="w-full px-4 py-3 rounded-xl border-2 border-[#E5EEE8] dark:border-[#24382f] focus:border-[#0fb762] focus:outline-none bg-white dark:bg-[#0f1714] text-sm leading-relaxed">${Utils.escapeHTML(userAns || '')}</textarea>
              </div>
            `;
          }

          // Immediate feedback block for Practice Mode / Review Mode
          const showImmediateAnswer = isReviewMode ||
            (attempt.answerDisplayMode === 'immediate' && userAns !== undefined && userAns !== null && userAns !== '');

          let feedbackHTML = '';
          if (showImmediateAnswer) {
            const graded = ScoringEngine.gradeQuestion(q, userAns);
            const correctDisplay = Array.isArray(q.correctAnswer)
              ? q.correctAnswer.join(', ')
              : (q.type === 'matching'
                ? (q.pairs || []).map(p => `${p.left} → ${p.right}`).join(' | ')
                : (q.type === 'ordering' ? (q.items || []).join(' → ') : q.correctAnswer));

            feedbackHTML = `
              <div class="mt-4 p-4 rounded-xl border ${
                isReviewMode
                  ? 'bg-[#F7FBF8] dark:bg-[#16221d] border-[#0fb762]'
                  : (graded.isCorrect ? 'bg-[#8eff7b]/20 border-[#0fb762]' : 'bg-[#DC4B4B]/10 border-[#DC4B4B]')
              }">
                <div class="font-bold text-sm flex items-center gap-2 ${isReviewMode || graded.isCorrect ? 'text-[#0B9951]' : 'text-[#DC4B4B]'}">
                  <i data-lucide="${isReviewMode || graded.isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-4 h-4"></i>
                  ${isReviewMode ? 'เฉลยและคำอธิบาย' : (graded.isCorrect ? 'ถูกต้อง!' : 'ยังไม่ถูกต้อง')}
                </div>
                ${q.type !== 'essay' ? `<div class="text-xs font-semibold mt-1 text-[#173B2B] dark:text-white">เฉลยที่ถูกต้อง: ${Utils.escapeHTML(String(correctDisplay))}</div>` : ''}
                ${q.explanation ? `<div class="text-xs text-[#40564A] dark:text-gray-300 mt-1.5 leading-relaxed"><b>คำอธิบาย:</b> ${Utils.escapeHTML(q.explanation)}</div>` : ''}
              </div>
            `;
          }

          container.innerHTML = `
            <div class="space-y-4 pb-10">
              <!-- Sticky Top Exam Header -->
              <div class="card-surface p-3.5 sm:p-4 sticky top-14 lg:top-2 z-20 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded-md bg-[#0fb762]/15 text-[#0B9951] text-[11px] font-bold uppercase">${Utils.escapeHTML(attempt.mode)}</span>
                    <h1 class="font-bold text-sm sm:text-base truncate">${Utils.escapeHTML(attempt.examTitle)}</h1>
                  </div>
                  <div class="flex items-center gap-3 text-xs text-[#718278] mt-1">
                    <span>ทำแล้ว ${answeredCount}/${questions.length} ข้อ (${progressPct}%)</span>
                    <span id="autosave-indicator" class="inline-flex items-center gap-1 text-[#0B9951]">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> <span>Saved</span>
                    </span>
                  </div>
                </div>

                <div class="flex items-center gap-2.5">
                  ${attempt.deadlineAt ? `
                    <div id="quiz-timer-box" class="px-3.5 py-2 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f] flex items-center gap-2 font-display font-bold text-base sm:text-lg text-[#173B2B] dark:text-white">
                      <i data-lucide="timer" class="w-5 h-5 text-[#0fb762]"></i>
                      <span id="quiz-timer-display">--:--</span>
                    </div>
                  ` : `
                    <div class="px-3 py-1.5 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] text-xs font-semibold text-[#0B9951]">ไม่จำกัดเวลา</div>
                  `}

                  ${isReviewMode ? `
                    <button onclick="App.navigate('my-exams')" class="px-4 py-2 rounded-xl btn-primary text-xs sm:text-sm font-semibold">เสร็จสิ้นการอ่าน</button>
                  ` : `
                    <button id="submit-exam-btn" class="px-4 py-2 rounded-xl btn-primary text-xs sm:text-sm font-semibold flex items-center gap-1.5 shadow-xs">
                      <i data-lucide="send" class="w-4 h-4"></i> ส่งข้อสอบ
                    </button>
                  `}
                </div>
              </div>

              <!-- Main Quiz Grid -->
              <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">
                <!-- Question Card (3 cols) -->
                <div class="lg:col-span-3 card-surface p-5 sm:p-6 flex flex-col justify-between min-h-[380px]">
                  <div>
                    <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-[#E5EEE8] dark:border-[#24382f]">
                      <div class="flex items-center gap-2">
                        <span class="px-3 py-1 rounded-xl bg-[#0fb762] text-white font-bold text-sm">ข้อที่ ${currentIndex + 1} / ${questions.length}</span>
                        <span class="text-xs text-[#718278]">(${q.score || 1} คะแนน)</span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <button type="button" id="toggle-fav-btn" class="p-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] hover:border-[#E6A817]" title="บันทึกในรายการโปรด">
                          <i data-lucide="star" class="w-4 h-4 ${isFav ? 'fill-[#E6A817] text-[#E6A817]' : 'text-[#718278]'}"></i>
                        </button>
                        <button type="button" id="toggle-flag-btn" class="px-3 py-1.5 rounded-xl border text-xs font-semibold flex items-center gap-1.5 ${
                          isFlagged
                            ? 'bg-[#c6ec44]/40 border-[#E6A817] text-[#173B2B]'
                            : 'border-[#E5EEE8] dark:border-[#24382f] text-[#718278]'
                        }">
                          <i data-lucide="flag" class="w-3.5 h-3.5 ${isFlagged ? 'text-[#E6A817] fill-[#E6A817]' : ''}"></i>
                          <span>${isFlagged ? 'ทำเครื่องหมายทบทวนแล้ว' : 'ปักธงทบทวน'}</span>
                        </button>
                      </div>
                    </div>

                    <!-- Question Prompt -->
                    <div class="text-base sm:text-lg font-semibold text-[#173B2B] dark:text-white leading-relaxed mb-5 whitespace-pre-line">
                      ${Utils.escapeHTML(q.text)}
                    </div>

                    <!-- Answer Area -->
                    ${answerInputHTML}

                    <!-- Immediate Feedback if enabled -->
                    ${feedbackHTML}
                  </div>

                  <!-- Prev / Next Navigation -->
                  <div class="flex items-center justify-between gap-3 pt-6 mt-6 border-t border-[#E5EEE8] dark:border-[#24382f]">
                    <button type="button" id="prev-q-btn" ${currentIndex === 0 ? 'disabled' : ''}
                      class="px-4 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-sm font-semibold flex items-center gap-1.5 disabled:opacity-40">
                      <i data-lucide="chevron-left" class="w-4 h-4"></i> ข้อก่อนหน้า
                    </button>
                    <button type="button" id="next-q-btn" ${currentIndex === questions.length - 1 ? 'disabled' : ''}
                      class="px-4 py-2.5 rounded-xl bg-[#173B2B] dark:bg-[#0fb762] text-white text-sm font-semibold flex items-center gap-1.5 disabled:opacity-40">
                      ข้อถัดไป <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <!-- Question Navigator (1 col) -->
                <div class="card-surface p-4 h-fit">
                  <h3 class="font-bold text-sm mb-2">แผนผังข้อสอบ (Navigator)</h3>
                  <div class="flex flex-wrap gap-3 text-[11px] text-[#718278] mb-3">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-[#0fb762]"></span> ตอบแล้ว</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-[#c6ec44] border border-[#E6A817]"></span> ปักธง</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs border border-[#E5EEE8]"></span> ยังไม่ตอบ</span>
                  </div>
                  <div class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-1.5 max-h-72 overflow-y-auto p-0.5">
                    ${questions.map((item, idx) => {
                      const v = answers[item.id];
                      const hasAns = v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && v.length === 0);
                      const flagged = flaggedSet.has(item.id);
                      const active = idx === currentIndex;
                      let cls = 'border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-[#40564A] dark:text-gray-300';
                      if (hasAns) cls = 'bg-[#0fb762] border-[#0fb762] text-white';
                      if (flagged) cls = 'bg-[#c6ec44] border-[#E6A817] text-[#173B2B]';
                      if (active) cls += ' ring-2 ring-[#173B2B] dark:ring-white';
                      return `
                        <button type="button" data-nav-idx="${idx}"
                          class="h-9 rounded-lg border text-xs font-bold transition flex items-center justify-center ${cls}">
                          ${idx + 1}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          `;

          // Bind Answer Events
          container.querySelectorAll('[data-pick-single]').forEach(btn => {
            btn.onclick = async () => {
              const val = btn.getAttribute('data-pick-single');
              answers[q.id] = val;
              renderQuestionStage();
              await QuizEngine.saveAnswer(attemptId, q.id, val);
            };
          });

          container.querySelectorAll('[data-pick-multi]').forEach(btn => {
            btn.onclick = async () => {
              const val = btn.getAttribute('data-pick-multi');
              const arr = Array.isArray(answers[q.id]) ? [...answers[q.id]] : [];
              const pos = arr.indexOf(val);
              if (pos >= 0) arr.splice(pos, 1);
              else arr.push(val);
              answers[q.id] = arr;
              renderQuestionStage();
              await QuizEngine.saveAnswer(attemptId, q.id, arr);
            };
          });

          const textInp = document.getElementById('qp-text-input');
          if (textInp) {
            textInp.onchange = async (e) => {
              answers[q.id] = e.target.value;
              await QuizEngine.saveAnswer(attemptId, q.id, e.target.value);
              renderQuestionStage();
            };
          }

          const essayInp = document.getElementById('qp-essay-input');
          if (essayInp) {
            essayInp.onchange = async (e) => {
              answers[q.id] = e.target.value;
              await QuizEngine.saveAnswer(attemptId, q.id, e.target.value);
            };
          }

          container.querySelectorAll('[data-match-idx]').forEach(sel => {
            sel.onchange = async (e) => {
              const mIdx = e.target.getAttribute('data-match-idx');
              const cur = (answers[q.id] && typeof answers[q.id] === 'object') ? { ...answers[q.id] } : {};
              cur[mIdx] = e.target.value;
              answers[q.id] = cur;
              await QuizEngine.saveAnswer(attemptId, q.id, cur);
              renderQuestionStage();
            };
          });

          container.querySelectorAll('[data-ord-move-up]').forEach(btn => {
            btn.onclick = async () => {
              const i = Number(btn.getAttribute('data-ord-move-up'));
              const arr = [...(answers[q.id] || q.items)];
              if (i > 0) {
                [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
                answers[q.id] = arr;
                renderQuestionStage();
                await QuizEngine.saveAnswer(attemptId, q.id, arr);
              }
            };
          });

          container.querySelectorAll('[data-ord-move-down]').forEach(btn => {
            btn.onclick = async () => {
              const i = Number(btn.getAttribute('data-ord-move-down'));
              const arr = [...(answers[q.id] || q.items)];
              if (i < arr.length - 1) {
                [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
                answers[q.id] = arr;
                renderQuestionStage();
                await QuizEngine.saveAnswer(attemptId, q.id, arr);
              }
            };
          });

          // Navigation & Flags
          document.getElementById('prev-q-btn').onclick = async () => {
            if (currentIndex > 0) {
              currentIndex--;
              await QuizEngine.updateCurrentIndex(attemptId, currentIndex);
              renderQuestionStage();
            }
          };
          document.getElementById('next-q-btn').onclick = async () => {
            if (currentIndex < questions.length - 1) {
              currentIndex++;
              await QuizEngine.updateCurrentIndex(attemptId, currentIndex);
              renderQuestionStage();
            }
          };
          container.querySelectorAll('[data-nav-idx]').forEach(btn => {
            btn.onclick = async () => {
              currentIndex = Number(btn.getAttribute('data-nav-idx'));
              await QuizEngine.updateCurrentIndex(attemptId, currentIndex);
              renderQuestionStage();
            };
          });

          document.getElementById('toggle-flag-btn').onclick = async () => {
            if (flaggedSet.has(q.id)) flaggedSet.delete(q.id);
            else flaggedSet.add(q.id);
            await QuizEngine.toggleFlag(attemptId, q.id);
            renderQuestionStage();
          };

          document.getElementById('toggle-fav-btn').onclick = async () => {
            if (favoriteSet.has(q.id)) {
              favoriteSet.delete(q.id);
              await db.favorites.where('questionId').equals(q.id).delete();
              UI.toast('นำออกจากรายการโปรดแล้ว', 'info');
            } else {
              favoriteSet.add(q.id);
              await db.favorites.put({
                id: `fav_${q.id}`,
                questionId: q.id,
                question: q,
                subject: q.subject || attempt.subject || 'ทั่วไป',
                createdAt: new Date().toISOString()
              });
              UI.toast('เพิ่มลงในรายการโปรดสำเร็จ', 'success');
            }
            renderQuestionStage();
          };

          document.getElementById('submit-exam-btn')?.addEventListener('click', async () => {
            const unanswered = questions.filter(item => {
              const v = answers[item.id];
              return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
            }).length;

            const ok = await UI.confirm({
              title: 'ยืนยันการส่งข้อสอบ',
              message: unanswered > 0
                ? `<div class="p-3 rounded-xl bg-[#E6A817]/15 border border-[#E6A817] text-[#173B2B] dark:text-white mb-2"><b>แจ้งเตือน:</b> คุณยังมีข้อสอบที่ไม่ได้ตอบจำนวน <b>${unanswered} ข้อ</b></div>ต้องการส่งข้อสอบตอนนี้เลยหรือไม่?`
                : `คุณตอบคำถามครบทั้ง <b>${questions.length} ข้อ</b> เรียบร้อยแล้ว ยืนยันการส่งข้อสอบเพื่อตรวจคะแนนหรือไม่?`,
              confirmText: 'ยืนยันส่งข้อสอบ',
              cancelText: 'กลับไปทำต่อ'
            });

            if (ok) {
              const submitted = await QuizEngine.submitAttempt(attemptId, 'manual');
              if (submitted) App.navigate('quiz-result', { attemptId });
            }
          });

          lucide.createIcons({ nodes: [container] });
        };

        renderQuestionStage();

        // Start Deadline-based Countdown Timer
        if (attempt.deadlineAt && !isReviewMode) {
          QuizEngine.startCountdown(
            attempt,
            (remainingSec) => {
              const disp = document.getElementById('quiz-timer-display');
              const box = document.getElementById('quiz-timer-box');
              if (!disp || !box) return;
              disp.textContent = Utils.formatDuration(remainingSec);

              if (remainingSec <= 60) {
                box.className = 'px-3.5 py-2 rounded-xl bg-[#DC4B4B] text-white flex items-center gap-2 font-display font-bold text-base sm:text-lg timer-urgent shadow-md';
              } else if (remainingSec <= 300) {
                box.className = 'px-3.5 py-2 rounded-xl bg-[#E6A817]/20 border border-[#E6A817] text-[#E6A817] flex items-center gap-2 font-display font-bold text-base sm:text-lg';
              }
            },
            async () => {
              const submitted = await QuizEngine.submitAttempt(attemptId, 'auto_timeout');
              if (submitted) App.navigate('quiz-result', { attemptId });
            }
          );
        }
      },

      /* --------------------------------------------------------------------------
       * VIEW 5: QUIZ RESULT
       * -------------------------------------------------------------------------- */
      async renderQuizResult(container, attemptId) {
        const att = await db.attempts.get(attemptId);
        if (!att) return App.navigate('quiz-history');

        container.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-6 pb-10">
            <!-- Status Banner -->
            <div class="card-surface p-6 sm:p-8 text-center relative overflow-hidden">
              <div class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center ${
                att.passed ? 'bg-[#0fb762] text-white' : 'bg-[#DC4B4B] text-white'
              } shadow-md">
                <i data-lucide="${att.passed ? 'award' : 'alert-circle'}" class="w-9 h-9"></i>
              </div>

              <span class="inline-block px-4 py-1 rounded-full text-xs font-bold mb-2 ${
                att.passed ? 'bg-[#8eff7b]/40 text-[#0B9951]' : 'bg-[#DC4B4B]/15 text-[#DC4B4B]'
              }">
                ${att.passed ? 'สอบผ่านเกณฑ์ (PASSED)' : 'ไม่ผ่านเกณฑ์ (FAILED)'}
              </span>

              <h1 class="text-xl sm:text-2xl font-bold text-[#173B2B] dark:text-white">${Utils.escapeHTML(att.examTitle)}</h1>
              <p class="text-xs sm:text-sm text-[#718278] mt-1">
                ${att.examineeName ? `ผู้เข้าสอบ: <b>${Utils.escapeHTML(att.examineeName)}</b> • ` : ''}
                ส่งข้อสอบเมื่อ ${Utils.formatDate(att.submittedAt)}
              </p>

              <!-- Big Score Display -->
              <div class="my-6 p-5 rounded-2xl bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f] grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
                <div>
                  <div class="text-xs text-[#718278]">คะแนนที่ได้</div>
                  <div class="text-2xl sm:text-3xl font-bold text-[#173B2B] dark:text-white mt-0.5">${att.earnedScore} <span class="text-base font-normal text-[#718278]">/ ${att.totalScore}</span></div>
                </div>

      /* --------------------------------------------------------------------------
       * VIEW 6: REVIEW ANSWERS (With Filter & Manual Essay Grading)
       * -------------------------------------------------------------------------- */
      async renderReviewAnswers(container, attemptId) {
        const att = await db.attempts.get(attemptId);
        if (!att) return App.navigate('quiz-history');

        let filterStatus = 'all';

        const renderList = () => {
          const details = att.gradingDetails || [];
          const filtered = details.filter(d => {
            if (filterStatus === 'all') return true;
            return d.status === filterStatus;
          });

          container.innerHTML = `
            <div class="space-y-5 pb-12">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h1 class="text-xl sm:text-2xl font-bold">ทบทวนคำตอบและเฉลย</h1>
                  <p class="text-xs text-[#718278]">${Utils.escapeHTML(att.examTitle)} • คะแนนรวม ${att.earnedScore}/${att.totalScore} (${att.percentage}%)</p>
                </div>
                <button onclick="App.navigate('quiz-result', { attemptId: '${att.id}' })" class="px-4 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] text-sm font-medium flex items-center gap-1.5 w-fit">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าสรุปผล
                </button>
              </div>

              <!-- Filter Tabs -->
              <div class="flex flex-wrap gap-2">
                ${[
                  { id: 'all', label: `ทั้งหมด (${details.length})` },
                  { id: 'correct', label: `ตอบถูก (${att.correctCount})` },
                  { id: 'incorrect', label: `ตอบผิด (${att.incorrectCount})` },
                  { id: 'unanswered', label: `ไม่ตอบ (${att.unansweredCount})` }
                ].map(tab => `
                  <button data-rev-filter="${tab.id}" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${
                    filterStatus === tab.id
                      ? 'bg-[#0fb762] text-white'
                      : 'bg-white dark:bg-[#0f1714] border border-[#E5EEE8] dark:border-[#24382f] text-[#40564A] dark:text-gray-300'
                  }">${tab.label}</button>
                `).join('')}
              </div>

              <!-- Questions Review Cards -->
              <div class="space-y-4">
                ${filtered.map(d => {
                  const qIdx = att.questionsSnapshot.findIndex(q => q.id === d.questionId);
                  const q = att.questionsSnapshot[qIdx];
                  if (!q) return '';

                  const formatAns = (val) => {
                    if (val === undefined || val === null || val === '' || (Array.isArray(val) && val.length === 0)) return '<span class="italic text-[#718278]">ไม่ได้ตอบ</span>';
                    if (Array.isArray(val)) return Utils.escapeHTML(val.join(', '));
                    if (typeof val === 'object') return Utils.escapeHTML(Object.entries(val).map(([k, v]) => `${Number(k) + 1}→${v}`).join(', '));
                    return Utils.escapeHTML(String(val));
                  };

                  const correctText = q.type === 'matching'
                    ? (q.pairs || []).map(p => `${p.left} → ${p.right}`).join(' | ')
                    : (q.type === 'ordering' ? (q.items || []).join(' → ') : (Array.isArray(q.correctAnswer) ? q.correctAnswer.join(', ') : q.correctAnswer));

                  const statusBadge = d.status === 'correct'
                    ? '<span class="px-2.5 py-0.5 rounded-full bg-[#8eff7b]/35 text-[#0B9951] text-xs font-bold">ถูกต้อง</span>'
                    : (d.status === 'unanswered'
                      ? '<span class="px-2.5 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-xs font-bold">ไม่ได้ตอบ</span>'
                      : (d.status === 'pending_review'
                        ? '<span class="px-2.5 py-0.5 rounded-full bg-[#c6ec44] text-[#173B2B] text-xs font-bold">รอตรวจอัตนัย</span>'
                        : '<span class="px-2.5 py-0.5 rounded-full bg-[#DC4B4B]/15 text-[#DC4B4B] text-xs font-bold">ตอบผิด</span>'));

                  return `
                    <div class="card-surface p-5 space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-sm text-[#0fb762]">ข้อที่ ${qIdx + 1}</span>
                          ${statusBadge}
                        </div>
                        <span class="text-xs font-semibold text-[#718278]">คะแนนที่ได้: ${d.earnedScore} / ${d.maxScore}</span>
                      </div>

                      <div class="font-semibold text-base text-[#173B2B] dark:text-white">${Utils.escapeHTML(q.text)}</div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                        <div class="p-3 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] border border-[#E5EEE8] dark:border-[#24382f]">
                          <div class="text-xs text-[#718278] mb-1">คำตอบของคุณ:</div>
                          <div class="font-semibold">${formatAns(d.userAnswer)}</div>
                        </div>
                        ${q.type !== 'essay' ? `
                          <div class="p-3 rounded-xl bg-[#a1ffcf]/25 dark:bg-[#0fb762]/15 border border-[#0fb762]/30">
                            <div class="text-xs text-[#0B9951] mb-1">เฉลยที่ถูกต้อง:</div>
                            <div class="font-semibold text-[#173B2B] dark:text-white">${Utils.escapeHTML(String(correctText))}</div>
                          </div>
                        ` : `
                          <div class="p-3 rounded-xl bg-[#c6ec44]/25 border border-[#E6A817]">
                            <div class="text-xs font-semibold mb-1">ให้คะแนนข้อสอบอัตนัย (เต็ม ${d.maxScore}):</div>
                            <div class="flex items-center gap-2">
                              <input type="number" id="essay-grade-${q.id}" value="${d.earnedScore}" min="0" max="${d.maxScore}" step="0.5"
                                class="w-24 px-2.5 py-1.5 rounded-lg border bg-white dark:bg-[#0f1714] text-sm" />
                              <button type="button" data-save-essay="${q.id}" class="px-3 py-1.5 rounded-lg btn-primary text-xs font-semibold">บันทึกคะแนน</button>
                            </div>
                          </div>
                        `}
                      </div>

                      ${q.explanation ? `
                        <div class="p-3.5 rounded-xl bg-[#F7FBF8] dark:bg-[#16221d] text-xs text-[#40564A] dark:text-gray-300 leading-relaxed">
                          <span class="font-bold text-[#173B2B] dark:text-white">คำอธิบายเฉลย:</span> ${Utils.escapeHTML(q.explanation)}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;

          container.querySelectorAll('[data-rev-filter]').forEach(btn => {
            btn.onclick = () => {
              filterStatus = btn.getAttribute('data-rev-filter');
              renderList();
            };
          });

          container.querySelectorAll('[data-save-essay]').forEach(btn => {
            btn.onclick = async () => {
              const qId = btn.getAttribute('data-save-essay');
              const val = Number(document.getElementById(`essay-grade-${qId}`).value || 0);
              const updatedManual = { ...(att.manualGrades || {}), [qId]: val };
              const reEval = ScoringEngine.evaluateAttempt(att.questionsSnapshot, att.answers, att.passingScore, updatedManual);
              Object.assign(att, {
                manualGrades: updatedManual,
                earnedScore: reEval.earnedScore,
                percentage: reEval.percentage,
                correctCount: reEval.correctCount,
                incorrectCount: reEval.incorrectCount,
                unansweredCount: reEval.unansweredCount,
                pendingReviewCount: reEval.pendingReviewCount,
                passed: reEval.passed,
                gradingDetails: reEval.details
              });
              await db.attempts.put(att);
              UI.toast('บันทึกคะแนนอัตนัยและคำนวณผลสอบใหม่เรียบร้อย', 'success');
              renderList();
            };
          });

          lucide.createIcons({ nodes: [container] });
        };

        renderList();
      },

      /* --------------------------------------------------------------------------

      async renderQuizHistory(container) {

        container.innerHTML = `

              <div class="flex flex-wrap gap-2">
                <button onclick="ExportImportService.exportResultsCSV()" class="px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#0f1714] text-xs font-semibold flex items-center gap-1.5">

              </div>
            </div>

            <div class="card-surface p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input type="text" id="hist-search" placeholder="ค้นหาชื่อข้อสอบ หรือชื่อผู้เข้าสอบ..."
                class="px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm" />
              <select id="hist-status" class="px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">

              </select>
              <select id="hist-sort" class="px-3.5 py-2 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-sm">
                <option value="date_desc">วันที่สอบล่าสุด</option>
                <option value="score_desc">คะแนนสูงสุดไปต่ำสุด</option>
                <option value="score_asc">คะแนนต่ำสุดไปสูงสุด</option>
              </select>
            </div>

            <div id="history-table-root"></div>
          </div>
        `;

        const renderTable = () => {
          const q = document.getElementById('hist-search').value.trim().toLowerCase();
          const st = document.getElementById('hist-status').value;
          const sort = document.getElementById('hist-sort').value;

          let list = attempts.filter(a => {
            if (q && !a.examTitle.toLowerCase().includes(q) && !(a.examineeName || '').toLowerCase().includes(q)) return false;
            if (st === 'PASS' && !a.passed) return false;
            if (st === 'FAIL' && a.passed) return false;
            return true;
          });

          if (sort === 'score_desc') list.sort((a, b) => b.percentage - a.percentage);
          else if (sort === 'score_asc') list.sort((a, b) => a.percentage - b.percentage);

          const root = document.getElementById('history-table-root');
          if (list.length === 0) {
            root.innerHTML = `
              <div class="card-surface p-12 text-center">
                <i data-lucide="history" class="w-12 h-12 text-[#718278] mx-auto mb-3"></i>
                <h3 class="font-bold text-base">ไม่พบประวัติการสอบ</h3>
                <p class="text-xs text-[#718278] mt-1">เริ่มต้นทำข้อสอบเพื่อบันทึกสถิติและผลคะแนนของคุณ</p>

          root.innerHTML = `

              <table class="w-full text-left border-collapse min-w-[780px]">

                  <tr class="border-b border-[#E5EEE8] dark:border-[#24382f] bg-[#F7FBF8] dark:bg-[#16221d] text-xs text-[#718278]">
                    <th class="p-3.5">ชุดข้อสอบ</th>
                    <th class="p-3.5">ผู้เข้าสอบ</th>
                    <th class="p-3.5">วันที่ส่ง</th>
                    <th class="p-3.5 text-center">เวลาที่ใช้</th>
                    <th class="p-3.5 text-center">คะแนน</th>
                    <th class="p-3.5 text-center">สถานะ</th>
                    <th class="p-3.5 text-right">จัดการ</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#E5EEE8] dark:divide-[#24382f] text-sm">
                  ${list.map(a => `
                    <tr class="hover:bg-[#F7FBF8] dark:hover:bg-[#16221d]">
                      <td class="p-3.5">
                        <div class="font-semibold text-[#173B2B] dark:text-white">${Utils.escapeHTML(a.examTitle)}</div>
                        <div class="text-xs text-[#718278]">${Utils.escapeHTML(a.subject || '-')} • v.${a.examVersion || 1}</div>
                      </td>
                      <td class="p-3.5 text-xs">${Utils.escapeHTML(a.examineeName || 'ไม่ระบุชื่อ')}</td>
                      <td class="p-3.5 text-xs text-[#718278]">${Utils.formatDate(a.submittedAt)}</td>
                      <td class="p-3.5 text-center text-xs">${Utils.formatDuration(a.durationSeconds)}</td>
                      <td class="p-3.5 text-center font-bold">${a.earnedScore}/${a.totalScore} (${a.percentage}%)</td>
                      <td class="p-3.5 text-center">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${a.passed ? 'bg-[#8eff7b]/35 text-[#0B9951]' : 'bg-[#DC4B4B]/15 text-[#DC4B4B]'}">
                          ${a.passed ? 'ผ่าน' : 'ไม่ผ่าน'}
                        </span>
                      </td>
                      <td class="p-3.5 text-right">
                        <div class="inline-flex items-center gap-1.5">
                          <button onclick="App.navigate('quiz-result', { attemptId: '${a.id}' })" class="px-2.5 py-1.5 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] text-xs font-semibold hover:border-[#0fb762]">ผลสอบ</button>
                          <button onclick="App.navigate('review-answers', { attemptId: '${a.id}' })" class="px-2.5 py-1.5 rounded-lg bg-[#0fb762]/15 text-[#0B9951] text-xs font-semibold">เฉลย</button>
                          <button onclick="Views.deleteAttempt('${a.id}')" class="p-1.5 rounded-lg text-[#DC4B4B] hover:bg-[#DC4B4B]/10" title="ลบประวัติ"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
          lucide.createIcons({ nodes: [root] });
        };

        ['hist-search', 'hist-status', 'hist-sort'].forEach(id => {
          document.getElementById(id).addEventListener('input', renderTable);
        });
        renderTable();
      },

      async deleteAttempt(attemptId) {
        const ok = await UI.confirm({
          title: 'ลบประวัติการสอบ',
          message: 'ต้องการลบรายการประวัติการสอบนี้ใช่หรือไม่? (ชุดข้อสอบต้นฉบับจะไม่ถูกลบ)',
          confirmText: 'ลบประวัติ',
          danger: true
        });
        if (!ok) return;
        await db.attempts.delete(attemptId);
        UI.toast('ลบประวัติการสอบเรียบร้อยแล้ว', 'success');
        App.navigate('quiz-history');
      },

            if (subj && item.subject !== subj) return false;
            if (diff && item.difficulty !== diff) return false;

          });

          const root = document.getElementById('bank-list-root');
          if (filtered.length === 0) {
            root.innerHTML = `
              <div class="card-surface p-12 text-center">
                <i data-lucide="database" class="w-12 h-12 text-[#718278] mx-auto mb-3"></i>

                      ${Utils.difficultyBadge(item.difficulty)}

                    <button data-bank-del="${item.id}" class="p-2 rounded-lg border border-[#E5EEE8] dark:border-[#24382f] text-[#DC4B4B]" title="ลบ"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

          root.querySelectorAll('[data-bank-to-exam]').forEach(btn => {

              const bItem = bankQs.find(x => x.id === bId);
              UI.openModal(`
                <div class="p-5 border-b border-[#E5EEE8] dark:border-[#24382f] flex items-center justify-between">
                  <h3 class="font-bold text-base">เพิ่มคำถามเข้าชุดข้อสอบ</h3>
                  <button onclick="UI.closeModal()" class="p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-5 space-y-4">
                  <label class="block text-xs font-semibold">เลือกชุดข้อสอบปลายทาง</label>
                  <select id="target-exam-select" class="w-full px-3.5 py-2.5 rounded-xl border border-[#E5EEE8] dark:border-[#24382f] bg-white dark:bg-[#16221d] text-sm">
                    ${exams.map(e => `<option value="${e.id}">${Utils.escapeHTML(e.title)} (${e.questionCount || 0} ข้อ)</option>`).join('')}

                  <div class="flex justify-end gap-2">
                    <button onclick="UI.closeModal()" class="px-4 py-2 rounded-xl border text-sm">ยกเลิก</button>
                    <button id="confirm-add-to-exam" class="px-4 py-2 rounded-xl btn-primary text-sm font-semibold">เพิ่มลงชุดข้อสอบ</button>
                  </div>
                </div>
              `);
              document.getElementById('confirm-add-to-exam').onclick = async () => {
                const targetExamId = document.getElementById('target-exam-select').value;
                const ex = await db.exams.get(targetExamId);
                const curCount = await db.questions.where('examId').equals(targetExamId).count();
                await db.questions.put({
                  ...JSON.parse(JSON.stringify(bItem)),
                  id: Utils.uid('q'),
                  examId: targetExamId,
                  order: curCount + 1

                await db.exams.update(targetExamId, {
                  questionCount: curCount + 1,

                  updatedAt: new Date().toISOString()

                UI.toast('เพิ่มคำถามลงในชุดข้อสอบสำเร็จ', 'success');

              App.navigate('question-bank');
            };
          });

          lucide.createIcons({ nodes: [root] });

          document.getElementById(id).addEventListener('input', renderBankList);

      /* --------------------------------------------------------------------------
       * VIEW 9: LEARNING ANALYTICS (Line, Bar, Donut Charts from Real Data)
       * -------------------------------------------------------------------------- */
      async renderAnalytics(container) {
        const attempts = await db.attempts.where('status').equals('completed').sortBy('submittedAt');

        if (attempts.length === 0) {
          container.innerHTML = `
            <div class="card-surface p-12 text-center max-w-lg mx-auto my-8">
              <i data-lucide="bar-chart-3" class="w-14 h-14 text-[#0fb762] mx-auto mb-3"></i>
              <h2 class="font-bold text-lg">ยังไม่มีข้อมูลสำหรับวิเคราะห์ผลการเรียน</h2>
              <p class="text-sm text-[#718278] mt-1 mb-5">กราฟวิเคราะห์คะแนนรายวิชา อัตราการสอบผ่าน และพัฒนาการ จะแสดงอัตโนมัติเมื่อคุณทำข้อสอบเสร็จสิ้นอย่างน้อย 1 ครั้ง</p>
              <button onclick="App.navigate('my-exams')" class="px-5 py-2.5 rounded-xl btn-primary text-sm font-semibold">ไปที่คลังข้อสอบ</button>
            </div>
          `;
          return;
        }

        const total = attempts.length;
        const avg = (attempts.reduce((s, a) => s + a.percentage, 0) / total).toFixed(1);
        const highest = Math.max(...attempts.map(a => a.percentage)).toFixed(1);
        const lowest = Math.min(...attempts.map(a => a.percentage)).toFixed(1);
        const passed = attempts.filter(a => a.passed).length;
        const failed = total - passed;
        const avgDuration = Math.round(attempts.reduce((s, a) => s + (a.durationSeconds || 0), 0) / total);

        // Group by Subject
        const subjMap = {};
        attempts.forEach(a => {
          const s = a.subject || 'ทั่วไป';
          if (!subjMap[s]) subjMap[s] = { sum: 0, count: 0 };
          subjMap[s].sum += a.percentage;
          subjMap[s].count++;
        });
        const subjLabels = Object.keys(subjMap);
        const subjAvgs = subjLabels.map(s => Number((subjMap[s].sum / subjMap[s].count).toFixed(1)));

        container.innerHTML = `
          <div class="space-y-6 pb-10">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold">Learning Analytics (วิเคราะห์ผลการเรียน)</h1>
              <p class="text-xs sm:text-sm text-[#718278]">สรุปสถิติผลการสอบจริงทั้งหมด ${total} ครั้ง</p>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
              <div class="card-surface p-4">
                <div class="text-xs text-[#718278]">คะแนนเฉลี่ยรวม</div>
                <div class="text-2xl font-bold text-[#0fb762] mt-1">${avg}%</div>
              </div>
              <div class="card-surface p-4">
                <div class="text-xs text-[#718278]">คะแนนสูงสุด / ต่ำสุด</div>
                <div class="text-lg font-bold text-[#173B2B] dark:text-white mt-1">${highest}% / ${lowest}%</div>
              </div>
              <div class="card-surface p-4">
                <div class="text-xs text-[#718278]">อัตราการสอบผ่าน</div>
                <div class="text-2xl font-bold text-[#0B9951] mt-1">${Math.round((passed / total) * 100)}%</div>
              </div>
              <div class="card-surface p-4">
                <div class="text-xs text-[#718278]">เวลาเฉลี่ยต่อครั้ง</div>
                <div class="text-2xl font-bold text-[#173B2B] dark:text-white mt-1">${Utils.formatDuration(avgDuration)}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="card-surface p-5 lg:col-span-2">
                <h3 class="font-bold text-base mb-3">พัฒนาการคะแนนตามลำดับการสอบ (Score Progress)</h3>
                <div class="relative h-64">
                  <canvas id="analytics-line-chart"></canvas>
                </div>
              </div>
              <div class="card-surface p-5">
                <h3 class="font-bold text-base mb-3">สัดส่วนสอบผ่าน / ไม่ผ่าน</h3>
                <div class="relative h-64">
                  <canvas id="analytics-donut-chart"></canvas>
                </div>
              </div>
            </div>

            <div class="card-surface p-5">
              <h3 class="font-bold text-base mb-3">คะแนนเฉลี่ยแยกตามรายวิชา (Subject Performance)</h3>
              <div class="relative h-64">
                <canvas id="analytics-bar-chart"></canvas>
              </div>
            </div>
          </div>
        `;

        new Chart(document.getElementById('analytics-line-chart'), {
          type: 'line',
          data: {
            labels: attempts.map((a, i) => `ครั้งที่ ${i + 1}`),
            datasets: [{
              label: 'คะแนน (%)',
              data: attempts.map(a => a.percentage),
              borderColor: '#0fb762',
              backgroundColor: 'rgba(15, 183, 98, 0.15)',
              fill: true,
              tension: 0.3
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });

        new Chart(document.getElementById('analytics-donut-chart'), {
          type: 'doughnut',
          data: {
            labels: ['สอบผ่าน (Passed)', 'ไม่ผ่าน (Failed)'],
            datasets: [{
              data: [passed, failed],
              backgroundColor: ['#0fb762', '#DC4B4B'],
              borderWidth: 0
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('analytics-bar-chart'), {
          type: 'bar',
          data: {
            labels: subjLabels,
            datasets: [{
              label: 'คะแนนเฉลี่ย (%)',
              data: subjAvgs,
              backgroundColor: '#0fb762',
              borderRadius: 8
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
      },
